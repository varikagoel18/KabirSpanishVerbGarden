/* Cute sound effects via Web Audio (no asset files needed) */
const SFX = (()=>{
  let ctx;
  function ac(){ try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx&&ctx.state==="suspended") ctx.resume(); }catch(e){} return ctx; }
  function tone(freqs,dur,type,gain){
    const c=ac(); if(!c) return; let t=c.currentTime;
    freqs.forEach(f=>{ const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.value=f; o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur); t+=dur*0.85; });
  }
  return {
    right:()=>tone([523,659,784],0.13,"triangle",0.16),  // happy rising C-E-G
    wrong:()=>tone([392,294,233],0.16,"sine",0.14),       // gentle "womp womp"
    pop:()=>tone([880],0.07,"square",0.07)
  };
})();

const COMBO_MSGS = {

/* Normalize a typed answer for accent/punctuation-insensitive comparison. */
function normAnswer(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[¿?¡!.,;:"()]/g,"")
    .replace(/\s+/g," ").trim();
}

/* 10-sec per-question countdown. Attaches a bar above .q inside #stage.
   Returns {cancel()} — call on correct or 2nd-wrong so timeout doesn't fire.
   On timeout: onExpire() is invoked (usually: mark wrong + advance). */
function startQuestionTimer(seconds, onExpire){
  const q = document.querySelector('#stage .q');
  if(!q) return {cancel(){}};
  const owner = cur;
  const bar = document.createElement('div');
  bar.className = 'qtimer';
  bar.innerHTML = '<i></i><span class="qtimer-label">'+seconds+'s</span>';
  q.parentNode.insertBefore(bar, q);
  const iEl = bar.querySelector('i');
  const lbl = bar.querySelector('.qtimer-label');
  // Force layout, then start the CSS transition.
  iEl.getBoundingClientRect();
  iEl.style.transition = `width ${seconds}s linear`;
  iEl.style.width = '0%';
  const start = Date.now();
  const tick = setInterval(()=>{
    if(cur!==owner){ clearInterval(tick); return; }
    const remaining = Math.max(0, seconds - Math.floor((Date.now()-start)/1000));
    lbl.textContent = remaining+'s';
    if(remaining<=3) bar.classList.add('danger');
    else if(remaining<=6) bar.classList.add('warn');
  }, 250);
  const to = setTimeout(()=>{ clearInterval(tick); if(cur!==owner)return; bar.classList.add('expired'); onExpire(); }, seconds*1000);
  return { cancel(){ clearInterval(tick); clearTimeout(to); if(bar.parentNode) bar.parentNode.removeChild(bar); } };
}
function secondWrongAdvance(state, onAdvance){
  if(state.advancing) return true;
  state.wrongAttempts = (state.wrongAttempts||0) + 1;
  resetCombo();
  SFX.wrong();
  if(state.wrongAttempts >= 2){
    state.advancing = true;
    toast("Not quite — let's try the next one 💪");
    setTimeout(onAdvance, 650);
    return true;
  }
  sayOops();
  return false;
}

/* ---------- Lesson grid for the current level ---------- */
function renderDash(){
  const st=lvState(LVID);
  const plan=planFor(LV);
  const grid=$("#grid"); grid.innerHTML="";
  const nd=nextDay();
  const dry=freshDayPending(LVID);
  plan.forEach(p=>{
    const done = !!st.completed[p.d];
    const isNext = (p.d===nd) && !done;
    const locked = p.d>nd;
    const drought = dry && done;
    const isHouseQuiz   = p.house && p.houseType==="quiz";
    const isHouseLesson = p.house && !isHouseQuiz;
    const isFiestaQuiz  = p.fiesta && p.fiestaQuiz;
    const isFiestaLearn = p.fiesta && !isFiestaQuiz;
    // Universal rule: quiz-flavored days get 🌳; learning days get 🌱/flower.
    // Learning = Basics worksheets, house lessons, fiesta learn days, or explicit learning games.
    const isLearningDay = isHouseLesson || isFiestaLearn || p.game==="match" || p.game==="memory" || p.game==="conj";
    const isQuizDay = !isLearningDay && (
      p.bonus || isHouseQuiz || isFiestaQuiz || p.tense || p.pureQuiz || p.finale || p.game==="quiz"
    );
    const cell=document.createElement(locked?"div":"button");
    cell.className="cell"+(done?" done":"")+(drought?" drought":"")+(isNext?" today":"")+(locked?" locked":"")+(isQuizDay?" bonus":"");
    const icon = isQuizDay
      ? "🌳"
      : (done ? (drought?"🥀":flowerFor(p.d)) : (isNext? "🌱" : (locked? "🔒" : "🌱")));
    const stars = st.stars[p.d]||0;
    cell.innerHTML = `<span class="daynum">${p.d}</span><span class="icon">${icon}</span>`+

    if(!locked){ cell.onclick=()=>openDay(p.d); }

  });

  const pct = Math.round(maxDone()/totalLessons()*100);

}

/* ============================================================
   DAY FLOW
   ============================================================ */
let cur = null; // {plan, pool, newSet, stages, idx, score}

function openDay(d){
  startSession();
  const plan = planFor(LV).find(p=>p.d===d);
  const learnedPool = learnedUpTo(d).map(byId).filter(Boolean);
  const newSet = (plan.newV||[]).map(byId).filter(Boolean);
  const pool = focusPracticePool(d, learnedPool, newSet);
  const stages=[];
  const addIrregularQuiz = LVID===2 && d%2===0 && !plan.hw;
  if(plan.hw){
    // Spanish class HW quiz: single quiz screen then redo + bloom.
    stages.push({type:"hw_quiz", quizIdx:plan.quizIdx, plan});
    stages.push({type:"redo", plan});
  } else if(plan.tense){
    // Verb Tense practice: MCQ quiz for one lesson from TENSE_LESSONS.
    stages.push({type:"tense_quiz", quizIdx:plan.quizIdx, plan});
    stages.push({type:"redo", plan});
  } else if(plan.house){
    // Level 4 · La Casa
    if(plan.houseType==="quiz"){
      stages.push({type:"house_quiz", plan});
    } else {
      stages.push({type:"house_lesson", plan});
    }
    stages.push({type:"redo", plan});
  } else if(plan.bonus){
    stages.push({type:"bonus_review", plan});
    if(addIrregularQuiz) stages.push({type:"quiz", plan, irregularExtraQuiz:true});
  } else if(plan.pureQuiz){
    // Level 1 days 46-60 — quiz only, no intro/wordbuild/extras.
    stages.push({type:"quiz", plan});
    stages.push({type:"redo", plan});
  } else {
    if(newSet.length){ stages.push({type:"intro", verbs:newSet}); }
    else { stages.push({type:"intro", verbs:sample(pool, Math.min(4,pool.length))}); }
    const lateWB = d>30 && !plan.bonus;
    const wbVerbs = newSet.length ? newSet.slice(0,4) : sample(pool, Math.min(lateWB?5:3, pool.length));
    stages.push({type:"wordbuild", verbs:wbVerbs, plan, lateMix:lateWB});
    stages.push({type:plan.game, plan});
    if(addIrregularQuiz && plan.game!=="quiz") stages.push({type:"quiz", plan, irregularExtraQuiz:true});
    // Level 1 (regular verbs) always gets matching + sentence fill + paragraph fill,
    // even on the first play — richer practice per lesson.
    if(LVID===1){
      if(plan.game!=="match") stages.push({type:"match", plan});
      stages.push({type:"listenspell", plan});
      stages.push({type:"fillblank", plan});
      stages.push({type:"para_fill", plan});
    } else if(LVID===0){
      // Level 0 · Vocab Fiesta — skip sentence fill / paragraph fill so the generic
      // "Me gusta ___" default doesn't repeat across every lesson & quiz.
      stages.push({type:"listenspell", plan});
    } else {
      stages.push({type:"listenspell", plan});
      stages.push({type:(d % 2 === 1 ? "fillblank" : "truefalse"), plan});
    }
    stages.push({type:"redo", plan}); // replays questions Kabir got wrong on first try (incl. hint use)
  }
  stages.push({type:"bloom", plan});
  cur={plan, pool, allPool:learnedPool, newSet, oldSet:pool.filter(v=>!newSet.includes(v)), stages, idx:0, score:0, max:0, redoQueue:[], usedVerbIds:new Set(), hideQuestionImages:LVID===1 && !lvState(LVID).completed[d],
    hintUsedInLesson:false, houseSentenceCleanWin:0, houseListenCleanWin:0,
    _combo:0, _maxCombo:0,
    };
  $("#dvEmoji").textContent=plan.em;
  $("#dvTitle").textContent="Lesson "+d;
  $("#dvSub").textContent=plan.title;
  renderSteps();
  $("#overlay").classList.add("show","lesson-active");
  $("#overlay").classList.toggle("sticky-action-enabled",UX_FLAGS.stickyBar);
  document.body.style.overflow="hidden";
  runStage();
}
function closeDay(){
  endSession(); stageBottom(null);
  $("#overlay").classList.remove("show","lesson-active","sticky-action-enabled");
  document.body.style.overflow=""; cur=null;
}

function renderSteps(){
  const s=$("#steps"); s.innerHTML="";
  const subN = (cur.subPhases|0), subI = (cur.subPhase|0);
  cur.stages.forEach((_,i)=>{
    if(i===cur.idx && subN>1){
      // Expand the current stage into sub-phase pips so multi-phase renderers show real progress.
      for(let k=0;k<subN;k++){
        const bar=document.createElement("i");
        bar.className = k<subI?"done":(k===subI?"on":"");
        s.appendChild(bar);
      }
    } else {
      const bar=document.createElement("i");
      bar.className = i<cur.idx?"done":(i===cur.idx?"on":"");
      s.appendChild(bar);
    }
  });
}
function setSubStage(idx, total){
  if(!cur) return;
  cur.subPhase = idx|0; cur.subPhases = total|0;
  renderSteps();
}
function nextStage(){
  if(cur){ cur.subPhase = 0; cur.subPhases = 0; }
  cur.idx++;
  if(cur.idx>=cur.stages.length){ finishDay(); } else { renderSteps(); runStage(); }
}
function runStage(){
  stageBottom(null);
  const st=cur.stages[cur.idx];
  const map={intro:renderIntro, wordbuild:renderScramble, listenspell:renderListenSpell, voiceverb:renderVoiceVerb, match:renderMatch, quiz:renderQuiz, scramble:renderScramble, memory:renderMemory, conj:renderConj, fillblank:renderFill, truefalse:renderTF, para_fill:renderParaFill, bonus_review:renderBonusReview, tense_quiz:renderTenseQuiz, house_lesson:renderHouseLesson, house_quiz:renderHouseQuiz, redo:renderRedo, bloom:renderBloom};
  (map[st.type]||renderBloom)(st);
}

function qImage(v){
  return cur && cur.hideQuestionImages ? "" : `<div class="em">${v.em}</div>`;
}

function markFocusUsed(verbs){
  if(cur && cur.usedVerbIds && cur.plan && !cur.plan.bonus){
    verbs.forEach(v=>{ if(v) cur.usedVerbIds.add(v.id); });
  }
  return verbs;
}

function verbWeight(v){
  const stats = (STATE && STATE.verbStats) || {};
  const s = stats[v.id]; if(!s || s.attempts<2) return 0.7;          // unseen/new = neutral
  return 1.05 - (s.correct / s.attempts);                            // weak ~1.0, mastered ~0.1
}

function weightedFresh(list, n){
  return weightedSample(list.map(v=>({v, weight:verbWeight(v)})), Math.min(n, list.length));
}

/* Build a fresh focus set for each exercise. It avoids verbs already used earlier
   in the same lesson whenever possible; early lessons gracefully fall back because
   there are not enough unlocked verbs to make every stage unique. */
function pickFocus(n){
  const used = cur.usedVerbIds || new Set();
  let res = [];
  const add = vs => { vs.forEach(v=>{ if(v && !res.includes(v)) res.push(v); }); };
  add(shuffle(cur.newSet.filter(v=>!used.has(v.id))).slice(0, n));
  const olds = cur.oldSet.filter(v=>!res.includes(v));
  if(res.length < n && olds.length){
    add(weightedFresh(olds.filter(v=>!used.has(v.id)), n-res.length));
  }
  if(res.length < n){
    add(weightedFresh(cur.pool.filter(v=>!res.includes(v) && !used.has(v.id)), n-res.length));
  }
  if(res.length < n){
    add(weightedFresh(cur.pool.filter(v=>!res.includes(v)), n-res.length));
  }
  return markFocusUsed(shuffle(res));
}

function pickFreshFrom(list, n){
  const used = cur.usedVerbIds || new Set();
  let chosen = weightedFresh(list.filter(v=>!used.has(v.id)), n);
  if(chosen.length < n){
    chosen = chosen.concat(weightedFresh(list.filter(v=>!chosen.includes(v)), n-chosen.length));
  }
  return markFocusUsed(chosen);
}

/* After lesson 30, regular (non-bonus) lessons widen, but stay small enough that
   the whole lesson can use fresh verbs without forced repeats. */
function lateN(small){
  const late = cur && cur.plan && cur.plan.d > 30 && !cur.plan.bonus;
  return late ? Math.max(10, small) : small;
}

/* ---------- Matching ---------- */
function renderMatch(st){
  const picks=st.verbs && st.verbs.length
    ? markFocusUsed(st.verbs.slice(0, Math.min(10, st.verbs.length)))
    : pickFocus(Math.min(lateN(10), cur.pool.length));
  const n=picks.length;
  const left=shuffle(picks), right=shuffle(picks);
  let selected=null, matched=0;
  const missedIds={};      // pair-ids the kid got wrong before matching → no credit
  cur.max += n;            // every pair counts toward stars
  const stage=$("#stage");
  stage.innerHTML=`
    <p class="lead">${st.level2Warmup?"Irregular verb match 🔗":"Match the pairs 🔗"}</p>
    <p class="sub">${st.level2Warmup?"Warm up with the irregular verbs covered so far.":"Tap a verb or meaning first, then tap its match."}</p>
    <div class="match" id="mWrap"></div>`;
  const wrap=$("#mWrap");
  const colL=document.createElement("div"); const colR=document.createElement("div");
  colL.style.display=colR.style.display="grid"; colL.style.gap=colR.style.gap="10px";
  function handleMatchTap(b, v){
    if(b.classList.contains("ok")) return;
    if(b.dataset.side==="l") speak(v.inf);
    if(!selected || selected.dataset.side===b.dataset.side){
      wrap.querySelectorAll(".mtile").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
      selected=b;
      return;
    }
    const first=selected;
    if(first.dataset.id===b.dataset.id){
      celebrateSmallWin(b);
      b.classList.add("ok");
      first.classList.add("ok");
      first.classList.remove("sel");
      selected=null;
      matched++;
      recordVerbAttempt(+b.dataset.id, !missedIds[b.dataset.id]);
      cur.score++;
      if(matched===n){ confetti(16); toast("All matched! 🎉"); setTimeout(nextStage,650); }
    } else {
      SFX.wrong();
      b.classList.add("bad");
      first.classList.add("bad");
      missedIds[b.dataset.id]=true;
      missedIds[first.dataset.id]=true;
      setTimeout(()=>{ b.classList.remove("bad"); first.classList.remove("bad","sel"); },400);
      selected=null;
    }
  }
  left.forEach(v=>{
    const b=document.createElement("button"); b.className="mtile"; b.dataset.id=v.id; b.dataset.side="l";
    b.innerHTML=`${v.es}`; colL.appendChild(b);
    b.onclick=()=>handleMatchTap(b, v);
  });
  right.forEach(v=>{
    const b=document.createElement("button"); b.className="mtile"; b.dataset.id=v.id; b.dataset.side="r";
    b.innerHTML=`<span class="em">${v.em}</span>${v.en}`; colR.appendChild(b);
    b.onclick=()=>handleMatchTap(b, v);
  });
  wrap.appendChild(colL); wrap.appendChild(colR);
}

/* ---------- Quiz (multiple choice) ---------- */
function renderQuiz(st){
  const finale = st.plan.finale;
  const total = finale?8:lateN(6);
  const qs = pickFocus(Math.min(total,cur.pool.length));
  let i=0, done=false;
  const stage=$("#stage");
  const lead = st.irregularExtraQuiz ? "Irregular verb quiz ⚡" : "Pick the right word ✨";
  function draw(){
    const v=qs[i];
    const askEs = Math.random()<0.5; // sometimes ask Spanish->English
    const correct = askEs? v.en : v.es;
    const others = sample(cur.pool.filter(x=>x.id!==v.id), 3).map(x=>askEs?x.en:x.es);
    const opts = shuffle([correct,...others]);
    let missed=false, pushed=false; done=false;
    const wrongState={wrongAttempts:0};
    const promptHTML = askEs? `What does <b>${v.es}</b> mean?` : `How do you say <b>"${v.en}"</b>?`;
    stage.innerHTML=`
      <p class="lead">${lead}</p>
      <div class="qcount">Question ${i+1} of ${qs.length}</div>
      <div class="q">
        ${qImage(v)}
        <div class="ask">${promptHTML}</div>
      </div>
      <div class="opts" id="opts"></div>`;
    const o=$("#opts");
    let timer=null;
    const finish = ()=>{ if(timer){ timer.cancel(); timer=null; } };
    opts.forEach(txt=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=txt;
      b.onclick=()=>{
        if(done || b.classList.contains("no"))return;
        if(txt===correct){ done=true; finish(); b.classList.add("ok"); celebrateSmallWin(b); recordVerbAttempt(v.id, !missed); cur.score++;
          if(missed && !pushed){ addRedoQuestion({prompt:promptHTML, opts, correct, em:v.em, speak:v.inf, verbId:v.id}); pushed=true; }
          speak(v.inf); setTimeout(adv,650); }
        else { missed=true; b.classList.add("no"); if(secondWrongAdvance(wrongState, ()=>{ finish(); adv(); })) done=true; }
      };
      o.appendChild(b);
    });
    cur.max++;
    timer = startQuestionTimer(10, ()=>{
      if(done) return;
      done=true; missed=true;
      o.querySelectorAll("button").forEach(x=>x.disabled=true);
      toast("Time's up ⏰"); recordVerbAttempt(v.id, false);
      setTimeout(adv, 550);
    });
  }
  function adv(){ if(i<qs.length-1){ i++; draw(); } else { nextStage(); } }
  draw();
}

/* ---------- Scramble ---------- */
function renderScramble(st){
  const verbs = st.verbs ? markFocusUsed(st.verbs.slice(0, st.lateMix?5:4)) : pickFocus(Math.min(lateN(3),cur.pool.length));
  const rounds = verbs.length;
  const isToday = !!st.verbs;
  let r=0;
  cur.max += rounds;
  const stage=$("#stage");
  function draw(){
    const v=verbs[r];
    const letters=v.inf.split("");
    let scrambled=shuffle(letters);
    if(scrambled.join("")===v.inf.toLowerCase()) scrambled=shuffle(letters);
    let built=[]; let wordMissed=false;
    const wrongState={wrongAttempts:0};
    stage.innerHTML=`
      <p class="lead">${isToday?"Spell today's words 🔤":"Build the Spanish word 🔤"}</p>
      <p class="sub">Word ${r+1} of ${rounds} — read the meaning, then tap the jumbled letters to spell the Spanish verb.</p>
      <div class="scr-hint"><div class="em">${v.em}</div><div class="en">${v.en}</div></div>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <div style="text-align:center;margin-top:6px;">
        <button class="btn ghost sm" id="undo">⌫ Undo</button>
        <button class="speak" id="sp" style="vertical-align:middle">🔊</button>
      </div>`;
    const slots=$("#slots"), tiles=$("#tiles");
    function drawSlots(){ slots.innerHTML=""; for(let k=0;k<letters.length;k++){ const s=document.createElement("div");
      s.className="slot"+(built[k]?" filled":""); s.textContent=built[k]?built[k].ch:""; slots.appendChild(s);} }
    function drawTiles(){ tiles.innerHTML=""; scrambled.forEach((ch,idx)=>{ const b=document.createElement("button");
      b.className="tile"+(built.find(x=>x.idx===idx)?" used":""); b.textContent=ch;
      b.onclick=()=>{ if(built.find(x=>x.idx===idx))return; SFX.pop(); built.push({ch,idx}); drawSlots(); drawTiles(); check(); };
      tiles.appendChild(b); }); }
    function check(){
      if(built.length===letters.length){
        const word=built.map(x=>x.ch).join("");
        if(word.toLowerCase()===v.inf.toLowerCase()){ celebrateSmallWin(tiles); toast("¡Perfecto! "+v.inf+" 🌟"); speak(v.inf);
          recordVerbAttempt(v.id, !wordMissed);
          cur.score++;
          setTimeout(()=>{ if(r<rounds-1){ r++; draw(); } else nextStage(); },800);
        } else { wordMissed=true; slots.querySelectorAll(".slot").forEach(s=>s.classList.add("filled"));
          if(secondWrongAdvance(wrongState, ()=>{ if(r<rounds-1){ r++; draw(); } else nextStage(); })) return;
          $("#slots").animate?$("#slots").animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"none"}],{duration:300}):0;
          setTimeout(()=>{ built=[]; drawSlots(); drawTiles(); },450);
        }
      }
    }
    $("#undo").onclick=()=>{ built.pop(); drawSlots(); drawTiles(); };
    $("#sp").onclick=()=>speak(v.inf);
    drawSlots(); drawTiles();
  }
  draw();
}

/* ---------- Memory match ---------- */
function renderMemory(st){

  let cards=[];
  pairs.forEach(v=>{ cards.push({id:v.id,kind:"es",txt:v.es,em:v.em,inf:v.inf});

            open=[];busy=false;matched++; if(matched===need){confetti(16);toast("You remembered them all! 🎉");setTimeout(nextStage,600);} },350);
        } else {
          SFX.wrong();
          missedIds[cards[a.dataset.idx].id]=true; missedIds[cards[d.dataset.idx].id]=true;
          setTimeout(()=>{ [a,d].forEach(x=>{x.textContent="❓";x.style.fontSize="22px";x.classList.remove("sel");}); open=[];busy=false; },800);
        }
      }
    };
    wrap.appendChild(b);
  });
}

/* ---------- Conjugation ---------- */
function renderConj(st){
  const type=st.plan.conjType;
  let verbs;
  if(type==="mix") verbs=cur.pool;
  else verbs=cur.pool.filter(v=>v.t===type);
  if(verbs.length<3) verbs=cur.pool;
  const prons=["yo","tu","el","nos","ellos"];
  const qs=[]; const chosen=pickFreshFrom(verbs, Math.min(lateN(6),verbs.length));
  chosen.forEach(v=>qs.push({v, p:prons[Math.floor(Math.random()*prons.length)]}));
  let i=0, done=false;
  const stage=$("#stage");
  function draw(){
    const {v,p}=qs[i];
    const correct=conjugate(v,p);
    const wrongPron=prons.filter(x=>x!==p);
    const distract=shuffle(wrongPron).slice(0,3).map(x=>conjugate(v,x));
    const opts=shuffle([correct,...new Set(distract)]).slice(0,4);
    if(!opts.includes(correct)) opts[0]=correct;
    let missed=false, pushed=false; done=false;
    const wrongState={wrongAttempts:0};
    const promptHTML=`<b>${PRON[p]}</b> ____ <span style="color:var(--ink-soft);font-size:16px;">(${v.inf} · ${v.en})</span>`;
    stage.innerHTML=`
      <p class="lead">Add the right ending 🧩</p>
      <p class="sub">${st.plan.title}. Remember the ${v.t.toUpperCase()} endings!</p>
      <div class="qcount">Question ${i+1} of ${qs.length}</div>
      <div class="q">
        ${qImage(v)}
        <div class="ask">${promptHTML}</div>
      </div>

/* ---------- Fill in the blank (sentence) ---------- */
function renderFill(st){
  const items=pickFocus(lateN(5));
  let i=0, done=false;
  const stage=$("#stage");
  const useMCQ = LVID===2;   // Irregular verbs → MCQ options; others → typed input.
  function draw(){
    const v=items[i], data=fillFor(v);
    const correct = data.infMode ? v.inf : conjugate(v, data.p);
    const sentence=data.es.replace("___",`<span class="blank">?</span>`);
    let missed=false, pushed=false; done=false;
    const wrongState={wrongAttempts:0};
    if(useMCQ){
      const others=sample(cur.pool.filter(x=>x.id!==v.id),3).map(x=> data.infMode ? x.inf : conjugate(x, data.p));
      const opts=shuffle([correct, ...new Set(others)]).slice(0,4);
      if(!opts.includes(correct)) opts[0]=correct;
      stage.innerHTML=`
        <p class="lead">Finish the sentence ✏️</p>
        <div class="qcount">Sentence ${i+1} of ${items.length}</div>
        <div class="q">
          ${qImage(v)}
          <div class="ask" style="font-size:21px;line-height:1.4">${sentence}</div>
          <div class="sub" style="margin:8px 0 0">${data.en}</div>
        </div>
        <div class="opts" id="opts"></div>`;
      const o=$("#opts");
      shuffle(opts).forEach(txt=>{
        const b=document.createElement("button"); b.className="opt"; b.textContent=txt;
        b.onclick=()=>{
          if(done || b.classList.contains("no"))return;
          const bl=stage.querySelector(".blank");
          if(txt===correct){ done=true; b.classList.add("ok"); celebrateSmallWin(b); recordVerbAttempt(v.id, !missed); cur.score++;
            if(missed && !pushed){ addRedoQuestion({prompt:sentence, opts, correct, em:v.em, speak:data.es.replace("___",correct), verbId:v.id}); pushed=true; }
            if(bl){bl.textContent=correct;bl.classList.add("done");}
            speak(data.es.replace("___",correct)); setTimeout(adv,900);
          } else { missed=true; b.classList.add("no"); if(secondWrongAdvance(wrongState, adv)) done=true; }
        };
        o.appendChild(b);
      });
    } else {
      const accepted = new Set([normAnswer(correct)]);
      stage.innerHTML=`
        <p class="lead">Finish the sentence ✏️</p>
        <div class="qcount">Sentence ${i+1} of ${items.length}</div>
        <div class="q">
          ${qImage(v)}
          <div class="ask" style="font-size:21px;line-height:1.4">${sentence}</div>
          <div class="sub" style="margin:8px 0 0">${data.en}</div>
          <input id="fillIn" class="l0input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the verb form…"/>
          <div id="fillFeed" class="l0feed"></div>
        </div>`;
      const inp=$("#fillIn"), feed=$("#fillFeed");
      let actions={};
      function disableActions(){
        if(actions.primary) actions.primary.disabled=true;
        if(actions.secondary) actions.secondary.disabled=true;
      }
      function fillBlank(){ const bl=stage.querySelector(".blank"); if(bl){bl.textContent=correct;bl.classList.add("done");} }
      function check(){
        if(done) return;
        const val = normAnswer(inp.value); if(!val){ inp.focus(); return; }
        if(accepted.has(val)){
          done=true; SFX.right(); fillBlank();
          feed.textContent="¡Correcto! "+correct+" ✅"; feed.style.color="var(--leaf-dark)";
          disableActions(); inp.disabled=true;
          recordVerbAttempt(v.id, !missed); cur.score++;
          if(missed && !pushed){ addRedoQuestion({prompt:sentence, opts:[correct], correct, em:v.em, speak:data.es.replace("___",correct), verbId:v.id}); pushed=true; }
          speak(data.es.replace("___",correct));
          setTimeout(adv, 900);
        } else {
          missed=true;
          feed.textContent="Not quite — try again 💪"; feed.style.color="var(--berry)";
          if(secondWrongAdvance(wrongState, ()=>{ done=true; disableActions(); inp.disabled=true; adv(); })){
            done=true; disableActions(); inp.disabled=true;
          }
        }
      }
      function skipQuestion(){
        if(done) return; done=true;
        feed.textContent="Skipped ⏭"; feed.style.color="var(--ink-soft)";
        disableActions(); inp.disabled=true;
        setTimeout(adv, 350);
      }
      actions=stageBottom({label:"Check ➜",onClick:check,secondary:{label:"Skip ⏭",onClick:skipQuestion}});
      setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 50);
      inp.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); }});
    }
    cur.max++;
  }
  function adv(){ if(i<items.length-1){i++;draw();} else nextStage(); }
  draw();
}

/* ---------- Listen & spell (audio hint, build from jumbled letters) ---------- */
function renderListenSpell(st){
  const verbs=pickFocus(lateN(3));
  let r=0;
  cur.max += verbs.length;
  const stage=$("#stage");
  function draw(){
    const v=verbs[r];
    const letters=v.inf.split("");
    let scrambled=shuffle(letters);
    if(scrambled.join("")===v.inf.toLowerCase()) scrambled=shuffle(letters);
    let built=[], tries=0; let wordMissed=false;
    const wrongState={wrongAttempts:0};
    stage.innerHTML=`
      <p class="lead">Listen and spell 🎧</p>
      <p class="sub">Word ${r+1} of ${verbs.length} — tap 🔊 to hear it, then spell what you hear.</p>
      <div class="ear">🎧</div>
      <button class="bigspeak" id="bs">🔊</button>
      <div class="listen-hint" id="lh">Tap to hear the word again</div>
      <div class="slots" id="slots"></div>
      <div class="tiles" id="tiles"></div>
      <div style="text-align:center;margin-top:6px;">
        <button class="btn ghost sm" id="undo">⌫ Undo</button>
      </div>`;
    const slots=$("#slots"), tiles=$("#tiles");
    function drawSlots(){ slots.innerHTML=""; for(let k=0;k<letters.length;k++){ const s=document.createElement("div");
      s.className="slot"+(built[k]?" filled":""); s.textContent=built[k]?built[k].ch:""; slots.appendChild(s);} }
    function drawTiles(){ tiles.innerHTML=""; scrambled.forEach((ch,idx)=>{ const b=document.createElement("button");
      b.className="tile"+(built.find(x=>x.idx===idx)?" used":""); b.textContent=ch;
      b.onclick=()=>{ if(built.find(x=>x.idx===idx))return; SFX.pop(); built.push({ch,idx}); drawSlots(); drawTiles(); check(); };
      tiles.appendChild(b); }); }
    function check(){
      if(built.length===letters.length){
        const word=built.map(x=>x.ch).join("");
        if(word.toLowerCase()===v.inf.toLowerCase()){ celebrateSmallWin(tiles); toast("¡Sí! "+v.inf+" 🌟"); speak(v.inf);
          recordVerbAttempt(v.id, !wordMissed);
          cur.score++;
          setTimeout(()=>{ if(r<verbs.length-1){ r++; draw(); } else nextStage(); },850);
        } else { wordMissed=true; tries++;
          if(tries>=2){ $("#lh").innerHTML=`Hint: it means <b>"${v.en}"</b> ${v.em}`; }
          if(secondWrongAdvance(wrongState, ()=>{ if(r<verbs.length-1){ r++; draw(); } else nextStage(); })) return;
          setTimeout(()=>{ built=[]; drawSlots(); drawTiles(); },500);
        }
      }
    }
    $("#bs").onclick=()=>{ speak(v.inf); };
    $("#undo").onclick=()=>{ built.pop(); drawSlots(); drawTiles(); };
    drawSlots(); drawTiles();
    setTimeout(()=>speak(v.inf),250); // auto-play once
  }
  draw();
}

/* ---------- Voice the verb (say it out loud) ---------- */
function renderVoiceVerb(st){
  const verbs=pickFocus(lateN(3));
  let r=0;
  const stage=$("#stage");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,""); }
  function draw(){
    const v=verbs[r];
    stage.innerHTML=`
      <p class="lead">Say it out loud! 🎤</p>
      <p class="sub">Word ${r+1} of ${verbs.length} — tap 🔊 to hear it, then say it out loud. The mic is just for fun!</p>
      <div style="text-align:center">
        <div style="font-size:46px">${v.em}</div>
        <div class="say-word">${v.inf}</div>
        <div class="say-en">${v.en}</div>
        <button class="speak" id="hear" style="margin:10px auto 0">🔊</button>
      </div>
      <div style="text-align:center;margin-top:12px;">
        <button class="mic" id="mic" style="width:64px;height:64px;font-size:30px;margin:4px auto">🎤</button>
        <div class="heard" id="heard" style="font-size:13px">${SR?"Want to try the mic? (optional)":""}</div>
      </div>`;
    const heard=$("#heard"), mic=$("#mic");
    $("#hear").onclick=()=>speak(v.inf);
    const actions=stageBottom({label:"✅ I said it!",onClick:()=>{ celebrateSmallWin(actions.primary); adv(); }});
    setTimeout(()=>speak(v.inf),250);
    // Mic is fully optional and NEVER fails — always encouraging, always lets Kabir move on (#1)
    mic.onclick=()=>{
      if(!SR){ heard.textContent="Great speaking! 🌟"; celebrateSmallWin(mic); return; }
      let rec;
      try{ rec=new SR(); }catch(e){ heard.textContent="Great speaking! 🌟"; celebrateSmallWin(mic); return; }
      rec.lang="es-ES"; rec.interimResults=false; rec.maxAlternatives=3;
      mic.classList.add("live"); heard.textContent="Listening… 🎤";
      let got=false;
      rec.onresult=(e)=>{ got=true;
        const alts=[...e.results[0]].map(a=>norm(a.transcript));
        const target=norm(v.inf);
        const ok=alts.some(a=>a===target || a.includes(target) || target.includes(a));
        mic.classList.remove("live");
        // Always positive — match = perfect, no match = still praised (never "wrong")
        if(ok){ heard.innerHTML="¡Perfecto! You said it! 🌟"; celebrateSmallWin(mic); }
        else { heard.innerHTML="Nice try! Tap 🔊 to hear it again, then tap ✅ 🌱"; SFX.pop(); }
      };
      rec.onerror=()=>{ mic.classList.remove("live"); heard.textContent="That's okay! Just say it out loud and tap ✅ 🌟"; };
      rec.onend=()=>{ mic.classList.remove("live"); if(!got && heard.textContent==="Listening… 🎤") heard.textContent="Tap the mic to try, or just tap ✅ 🌟"; };
      try{ rec.start(); }catch(e){ mic.classList.remove("live"); heard.textContent="Just say it out loud and tap ✅ 🌟"; }
    };
  }
  function adv(){ if(r<verbs.length-1){ r++; draw(); } else nextStage(); }
  draw();
}

/* ---------- Bonus Review (every 6th lesson) ---------- */
function renderBonusReview(st){
  // For Level 2 (irregular verbs), the surprise quiz pool is ONLY the irregular verbs
  // Kabir has already covered in Level 2 lessons — no regulars mixed in.
  const isLvl2 = LVID === 2;
  let irregularPool = [], regularPool = [], pool;
  if(isLvl2){
    const lv2Collected = new Set((STATE.levels[2]||{}).collected||[]);
    const lv2Available = LV.verbs.filter(v=>lv2Collected.has(v.id));
    // If somehow nothing collected yet, fall back to all Level 2 verbs (very early state)
    irregularPool = lv2Available.length ? lv2Available : LV.verbs.slice();
    pool = irregularPool;
  } else {
    pool = cur.pool;
  }
  const prons = ["yo","tu","el","nos","ellos"];
  let phase = 0; // 0=vocab, 1=matching, 2=conj, 3=paragraph, 4=redo
  setSubStage(0, 5);

  function runPhase(){
    setSubStage(phase, 5);
    if(phase===0) vocabBlitz();
    else if(phase===1) matchingPhase();
    else if(phase===2) conjChallenge();
    else if(phase===3) paragraphFill();
    else if(phase===4) renderRedo({}); // replay missed questions across all phases
    else nextStage();
  }

  /* Phase 2 — Matching. For Level 2, draw exclusively from irregulars (most useful for review). */
  function matchingPhase(){
    const matchPool = isLvl2 ? irregularPool : pool;
    const n = Math.min(10, matchPool.length);
    const picks = sample(matchPool, n);
    const left = shuffle(picks), right = shuffle(picks);
    let selected=null, matched=0;
    const missedIds={};
    cur.max += n;
    const stage=$("#stage");
    stage.innerHTML=`
      <p class="lead">🔗 Matching <span style="font-size:13px;color:var(--ink-soft);font-weight:700"> — Part 2 of 4</span></p>
      <p class="sub">Tap a Spanish word or meaning first, then its match.</p>
      <div class="match" id="bmWrap"></div>`;
    const wrap=$("#bmWrap");
    const colL=document.createElement("div"); const colR=document.createElement("div");
    colL.style.display=colR.style.display="grid"; colL.style.gap=colR.style.gap="10px";
    function handleMatchChoice(b, v){
      if(b.classList.contains("ok")) return;
      if(b.dataset.side==="l") speak(v.inf);
      if(!selected){
        b.classList.add("sel");
        selected=b;
        return;
      }
      if(selected===b) return;
      if(selected.dataset.side===b.dataset.side){
        selected.classList.remove("sel");
        b.classList.add("sel");
        selected=b;
        return;
      }
      const first=selected;
      selected=null;
      const id=first.dataset.id;
      if(id===b.dataset.id){
        SFX.right(); b.classList.add("ok"); first.classList.add("ok"); first.classList.remove("sel"); matched++;
        cur.score++;
        // Track verb attempt for spaced repetition (clean match = right first try)
        const wasMissed=!!missedIds[id];
        recordVerbAttempt(parseInt(id), !wasMissed);
        if(matched===n){ toast("All matched! 🎉"); phase++; setTimeout(runPhase,650); }
      } else {
        SFX.wrong(); b.classList.add("bad"); first.classList.add("bad");
        missedIds[id]=true;
        missedIds[b.dataset.id]=true;
        setTimeout(()=>{b.classList.remove("bad","sel"); first.classList.remove("bad","sel");},400);
      }
    }
    left.forEach(v=>{
      const b=document.createElement("button"); b.className="mtile"; b.dataset.id=v.id; b.dataset.side="l";
      b.textContent=v.es; colL.appendChild(b);
      b.onclick=()=>handleMatchChoice(b, v);
    });
    right.forEach(v=>{
      const b=document.createElement("button"); b.className="mtile"; b.dataset.id=v.id; b.dataset.side="r";
      b.innerHTML=`<span class="em">${v.em}</span>${v.en}`; colR.appendChild(b);
      b.onclick=()=>handleMatchChoice(b, v);
    });
    wrap.appendChild(colL); wrap.appendChild(colR);
  }

  /* Phase 1 — Vocabulary blitz. Level 2 surprise tests all 20 verbs in the focused pool
     (13 irregulars + 7 regulars). Level 1 keeps the original 12-question sample. */
  function vocabBlitz(){
    const qs = isLvl2 ? shuffle(pool) : sample(pool, Math.min(12,pool.length));
    let i=0, done=false;
    const stage=$("#stage");
    function draw(){
      const v=qs[i];
      const askEs=Math.random()<0.5;
      const correct=askEs?v.en:v.es;
      const others=sample(pool.filter(x=>x.id!==v.id),3).map(x=>askEs?x.en:x.es);
      const opts=shuffle([correct,...others]);
      let missed=false, pushed=false; done=false;
      const wrongState={wrongAttempts:0};
      const promptHTML=askEs?`What does <b>${v.es}</b> mean?`:`How do you say <b>"${v.en}"</b>?`;
      stage.innerHTML=`
        <p class="lead">⚡ Vocab Blitz <span style="font-size:13px;color:var(--ink-soft);font-weight:700"> — Part 1 of 4</span></p>
        <p class="sub">All the words you've learned so far. No hints!</p>
        <div class="qcount">Question ${i+1} of ${qs.length}</div>
        <div class="q">
          ${qImage(v)}
          <div class="ask">${promptHTML}</div>
        </div>
        <div class="opts" id="opts"></div>`;
      const o=$("#opts");
      opts.forEach(txt=>{
        const b=document.createElement("button"); b.className="opt"; b.textContent=txt;
        b.onclick=()=>{
          if(done||b.classList.contains("no"))return;
          if(txt===correct){ done=true; b.classList.add("ok"); celebrateSmallWin(b); recordVerbAttempt(v.id, !missed); cur.score++;
            if(missed && !pushed){ addRedoQuestion({prompt:promptHTML, opts, correct, em:v.em, speak:v.inf, verbId:v.id}); pushed=true; }
            speak(v.inf); setTimeout(adv,650); }
          else{ missed=true; b.classList.add("no"); if(secondWrongAdvance(wrongState, adv)) done=true; }
        };
        o.appendChild(b);
      });
      cur.max++;
    }
    function adv(){ if(i<qs.length-1){i++;draw();} else{ confetti(16); toast("Vocab done! ⚡"); phase++; setTimeout(runPhase,700); } }
    draw();
  }

  /* Phase 2 — Conjugation challenge: full sentences (5+ words), 12 questions, ser/estar + regular.
     Procedural generation + STATE.seenConj tracking ensures questions never repeat across quizzes
     until the entire combo pool is exhausted (then it resets to keep playing). */
  function conjChallenge(){
    STATE.seenConj = STATE.seenConj || [];
    const seen = new Set(STATE.seenConj);
    const N = 12;
    const verbsPool = pool; // reference the outer renderBonusReview pool (avoid shadowing below)
    function buildCombos(){
      const out=[];
      SER_ESTAR_POOL.forEach((t,ti)=>{
        const key="SE|"+ti;
        if(!seen.has(key)) out.push({key, kind:"se", t});
      });
      verbsPool.forEach(v=>{
        ["yo","tu","el","nos","ellos"].forEach(p=>{
          CONJ_OBJECTS.forEach((_,oi)=>{
            SUBJECTS_BY_PRON[p].forEach((_,si)=>{
              // Prefix with level id so Level 1 / Level 2 verb id 1 don't collide
              const key="R|L"+(isLvl2?2:1)+"|"+v.id+"|"+p+"|"+oi+"|"+si;
              if(!seen.has(key)) out.push({key, kind:"r", v, p, oi, si});
            });
          });
        });
      });
      return out;
    }
    let combos=buildCombos();
    if(combos.length<N){ // exhausted — reset and rebuild
      STATE.seenConj=[]; seen.clear(); combos=buildCombos();
    }
    const picks=shuffle(combos).slice(0,N);
    picks.forEach(p=>STATE.seenConj.push(p.key));
    Store.save();
    const qs = picks.map(p=>{
      if(p.kind==="se"){
        const t=p.t; const correct = (t.form==="ser"?SER_FORMS:ESTAR_FORMS)[t.pron];
        return {pre:t.subj+" ", post:t.post, correct, opts:makeSerEstarOpts(t.form,t.pron), hint:t.hint};
      } else {
        return makeConjQuestion(p.v, p.p, p.oi, p.si);
      }
    });
    let i=0, done=false;
    const stage=$("#stage");
    function draw(){
      const q=qs[i];
      const opts=shuffle([q.correct, ...q.opts.filter(o=>o!==q.correct)]).slice(0,4);
      if(!opts.includes(q.correct)) opts[0]=q.correct;
      const sentence=`${q.pre}<span class="blank" style="background:#FFF7E2;min-width:72px">❓</span>${q.post}`;
      let missed=false, pushed=false; done=false;
      const wrongState={wrongAttempts:0};
      stage.innerHTML=`
        <p class="lead">🧩 Conjugation Challenge <span style="font-size:13px;color:var(--ink-soft);font-weight:700"> — Part 3 of 4</span></p>
        <p class="sub"><b>SER</b> = permanent · <b>ESTAR</b> = temporary/location/emotion · watch the ending!</p>
        <div class="qcount">Sentence ${i+1} of ${qs.length}</div>
        <div class="q">
          <div class="ask" style="font-size:20px;line-height:1.5">${sentence}</div>
          <div style="margin-top:10px"><button class="hint-btn" id="hintBtn" type="button">💡 Need a hint?</button></div>
          <div class="hint-text" id="hintText" hidden>${q.hint}</div>
        </div>
        <div class="opts" id="opts"></div>`;
      const hb=$("#hintBtn"); if(hb) hb.onclick=()=>{ missed=true; const t=$("#hintText"); if(t){ t.hidden=false; } hb.style.display="none"; setTimeout(()=>{ if(t) t.hidden=true; hb.style.display=""; },1500); };
      const o=$("#opts");
      opts.forEach(txt=>{

/* ===== LEVEL 4 · La Casa render helpers ============================= */
function houseVerbBySlug(word){
  const w=(word||"").toLowerCase().trim();
  return LEVEL4_HOUSE_VOCAB.find(v=>{
    if(v.es.toLowerCase()===w) return true;
    return (v.accepted||[]).some(a=>a.toLowerCase()===w);
  });
}
function houseNewVerbsFor(day){
  const plan = planFor(LV).find(p=>p.d===day);
  return ((plan && plan.newV)||[]).map(id=>LEVEL4_HOUSE_VOCAB.find(v=>v.id===id)).filter(Boolean);
}
function houseCollectedIds(){
  const s = (STATE.levels[4]||{completed:{}});
  const ids = new Set();
  for(const dk in s.completed){
    if(!s.completed[dk]) continue;
    const plan = planFor(LV).find(p=>p.d===+dk);
    if(plan) (plan.newV||[]).forEach(id=>ids.add(id));
  }
  return ids;
}
function houseAvailable(){
  // Verbs Kabir has learned so far in Level 4 (based on completed days)
  const ids = houseCollectedIds();
  return LEVEL4_HOUSE_VOCAB.filter(v=>ids.has(v.id));
}
function houseRoomsAvailable(){ return houseAvailable().filter(v=>v.group==="room"); }
function houseFurnitureAvailable(){ return houseAvailable().filter(v=>v.group==="furniture"); }
function stripHouseArticle(es){
  // Accept either a raw Spanish string or a vocab object with an `.es` property.
  // Prior versions passed objects here via `.map(stripHouseArticle)`, which turned every
  // distractor into the literal "[object Object]" and collapsed the opts list to 2 items.
  const s = (typeof es === "string") ? es : (es && typeof es==="object" && es.es ? es.es : "");
  return String(s).replace(/^(la|el|las|los)\s+/i,"").trim();
}
function houseArticle(v){
  const es=String(v.es||"");
  if(/^el\s+/i.test(es)) return "un";
  if(/^los\s+/i.test(es)) return "unos";
  if(/^las\s+/i.test(es)) return "unas";
  return "una";
}
function level4QuizNumber(day){
  return LEVEL4_LESSONS.filter(x=>x.type==="quiz" && x.d<=day).length-1;
}
function selectUniqueByDay(list, day, n, stride){
  if(!list.length) return [];
  const start=Math.max(0, day-1) * (stride||n);
  const out=[];
  for(let k=0; k<list.length && out.length<n; k++){
    out.push(list[(start+k)%list.length]);
  }
  return out;
}
function selectUniqueByQuiz(list, day, n, stride){
  if(!list.length) return [];
  const q=Math.max(0, level4QuizNumber(day));
  const start=q * (stride||n);
  const out=[];
  for(let k=0; k<list.length && out.length<n; k++){
    out.push(list[(start+k)%list.length]);
  }
  return out;
}
function houseQuizWordSet(day, pool, n=12){
  if(!pool.length) return [];
  const count=Math.min(n, pool.length);
  const q=Math.max(0, level4QuizNumber(day));
  const start=(q*count)%pool.length;
  const out=[];
  for(let k=0; k<pool.length && out.length<count; k++){
    out.push(pool[(start+k)%pool.length]);
  }
  return out;
}
function houseWordsThroughDay(day){
  const ids=new Set();
  LEVEL4_LESSONS.filter(x=>x.d<=day).forEach(x=>(x.newV||[]).forEach(id=>ids.add(id)));
  return LEVEL4_HOUSE_VOCAB.filter(v=>ids.has(v.id));
}
function houseQuestionWordSlice(pool, day, n, offset=0){
  if(!pool.length) return [];
  const qn=Math.max(0, level4QuizNumber(day));
  const start=(qn*7+offset)%pool.length;

function houseVocabQuestionBank(kind, pool){
  const poolIds=new Set(pool.map(v=>v.id));
  const variants = kind==="listen"
    ? [
        v=>({kind:"listen", em:"🎧", ask:"Listen and pick the meaning:", v}),
        v=>({kind:"listen", em:"🎧", ask:"What word did you hear?", v}),
        v=>({kind:"listen", em:"🎧", ask:"Listen for a La Casa word:", v}),
        v=>({kind:"listen", em:"🎧", ask:"Tap the meaning of the spoken word:", v}),
      ]
    : kind==="es-en"
      ? [
          v=>({kind:"mc", em:v.em, ask:`What does <b>${v.es}</b> mean?`, v, direction:"es-en"}),
          v=>({kind:"mc", em:v.em, ask:`Choose the English for <b>${v.es}</b>.`, v, direction:"es-en"}),
          v=>({kind:"mc", em:v.em, ask:`In a house, <b>${v.es}</b> means...`, v, direction:"es-en"}),
          v=>({kind:"mc", em:v.em, ask:`Pick the meaning of <b>${v.es}</b>.`, v, direction:"es-en"}),
          v=>({kind:"mc", em:v.em, ask:`Which English word matches <b>${v.es}</b>?`, v, direction:"es-en"}),
          v=>({kind:"mc", em:v.em, ask:`Find the translation for <b>${v.es}</b>.`, v, direction:"es-en"}),
        ]
      : [
          v=>({kind:"mc", em:v.em, ask:`How do you say <b>"${v.en}"</b>?`, v, direction:"en-es"}),
          v=>({kind:"mc", em:v.em, ask:`Choose the Spanish for <b>"${v.en}"</b>.`, v, direction:"en-es"}),
          v=>({kind:"mc", em:v.em, ask:`Which La Casa word means <b>"${v.en}"</b>?`, v, direction:"en-es"}),
          v=>({kind:"mc", em:v.em, ask:`Pick the Spanish word for <b>"${v.en}"</b>.`, v, direction:"en-es"}),
          v=>({kind:"mc", em:v.em, ask:`What is <b>"${v.en}"</b> in Spanish?`, v, direction:"en-es"}),
          v=>({kind:"mc", em:v.em, ask:`Find the Spanish match for <b>"${v.en}"</b>.`, v, direction:"en-es"}),
        ];
  const out=[];
  LEVEL4_HOUSE_VOCAB.forEach(v=>{
    if(!poolIds.has(v.id)) return;
    variants.forEach(make=>out.push(make(v)));
  });
  return out;
}
function selectHouseVocabQuestions(kind, pool, day, n, offset=0){
  if(!pool.length) return [];
  const bank=houseVocabQuestionBank(kind, pool);
  const byId=new Map();
  bank.forEach(q=>{
    const a=byId.get(q.v.id)||[];
    a.push(q);
    byId.set(q.v.id, a);
  });
  const words=houseQuestionWordSlice(pool, day, n, offset);
  return words.map(v=>{
    const variants=byId.get(v.id)||[];
    if(!variants.length) return null;
    const priorUses=LEVEL4_LESSONS
      .filter(x=>x.type==="quiz" && x.d<day)
      .reduce((sum,x)=>{
        const prevPool=houseWordsThroughDay(x.d);
        return sum + (houseQuestionWordSlice(prevPool, x.d, n, offset).some(p=>p.id===v.id) ? 1 : 0);
      },0);
    return variants[priorUses%variants.length];
  }).filter(Boolean);
}
function finalizeHouseVocabQuestion(q, pool){
  const v=q.v;
  const others=sample(pool.filter(x=>x.id!==v.id), 3);
  if(q.kind==="listen"){
    return {...q, opts:shuffle([v.en, ...others.map(o=>o.en)]), correct:v.en, hint:v.group.replace("_"," "), speak:v.es, listeningQuestion:true};
  }
  if(q.direction==="es-en"){
    return {...q, opts:shuffle([v.en, ...others.map(o=>o.en)]), correct:v.en, hint:v.group.replace("_"," "), speak:v.es};
  }
  return {...q, opts:shuffle([v.es, ...others.map(o=>o.es)]), correct:v.es, hint:v.group.replace("_"," "), speak:v.es};
}

    add({ids:[r.id], pre:"En mi casa hay ", correct:stripHouseArticle(r.es), post:" que usamos mucho "+r.id+".", opts:rooms.filter(x=>x.id!==r.id).slice(6,9).map(stripHouseArticle).concat(stripHouseArticle(r.es)), hint:r.en});
    add({ids:[r.id], pre:"Mi lugar favorito es ", correct:stripHouseArticle(r.es), post:" en esta actividad "+r.id+".", opts:rooms.filter(x=>x.id!==r.id).slice(9,12).map(stripHouseArticle).concat(stripHouseArticle(r.es)), hint:r.en});
  });
  const partTails=[
    " cuando entro en casa.",
    " cerca de la sala.",
    " al lado de la ventana.",
    " encima de mi cabeza.",
    " debajo de mis pies.",
    " para subir al segundo piso."
  ];
  parts.forEach(p=>{
    const tail=partTails[(p.id-17)%partTails.length];
    add({ids:[p.id], pre:"La parte de la casa es ", correct:stripHouseArticle(p.es), post:tail, opts:parts.filter(x=>x.id!==p.id).slice(0,3).map(stripHouseArticle).concat(stripHouseArticle(p.es)), hint:p.en});

  });
  LEVEL4_HOUSE_VOCAB.forEach(v=>{
    const sameGroup=LEVEL4_HOUSE_VOCAB.filter(x=>x.group===v.group && x.id!==v.id);
    const fallback=LEVEL4_HOUSE_VOCAB.filter(x=>x.id!==v.id);
    const optsA=(sameGroup.length>=3?sameGroup:fallback).slice(0,3).map(stripHouseArticle).concat(stripHouseArticle(v.es));
    const optsB=(sameGroup.length>=6?sameGroup.slice(3,6):fallback.slice(3,6)).map(stripHouseArticle).concat(stripHouseArticle(v.es));
    const optsC=(sameGroup.length>=9?sameGroup.slice(6,9):fallback.slice(6,9)).map(stripHouseArticle).concat(stripHouseArticle(v.es));
    add({ids:[v.id], pre:"En el reto de casa "+v.id+", Kabir dice ", correct:stripHouseArticle(v.es), post:" con voz clara.", opts:optsA, hint:v.en});

  if(pool.length<minWords){
    // safety: not enough vocab yet
    $("#stage").innerHTML=`<p class="lead">Learn a few more words first! 🏠</p><p class="sub">This quiz needs at least ${minWords} covered La Casa words.</p>`;
    stageBottom({label:"Continue",onClick:nextStage});
    return;
  }
  const quizWords = houseQuizWordSet(plan.d, pool, 12);
  // Matching covers up to 12 learned words; mixed questions draw from the full already-covered pool.
  const qs = [];
  const esToEnPicks = selectHouseVocabQuestions("es-en", pool, plan.d, 5, 0)
    .map(q=>finalizeHouseVocabQuestion(q, pool));
  esToEnPicks.forEach(q=>qs.push(q));
  const enToEsPicks = selectHouseVocabQuestions("en-es", pool, plan.d, 5, 5)
    .map(q=>finalizeHouseVocabQuestion(q, pool));
  enToEsPicks.forEach(q=>qs.push(q));
  // 3 sentence fill-ins
  const sentPicks = pickHouseSentences(plan.d, 3, pool);
  sentPicks.forEach(it=>{
    const opts=shuffle([it.correct, ...it.opts.filter(o=>o!==it.correct)]).slice(0,4);
    if(!opts.includes(it.correct)) opts[0]=it.correct;
    const sentenceHTML=`${it.pre}<span class="blank">___</span>${it.post}`;
    qs.push({kind:"fill", em:"✏️", ask:sentenceHTML, opts, correct:it.correct, hint:it.hint, speak:(it.pre+it.correct+it.post).trim(), sentenceQuestion:true});
  });
  // 2 listening (play word, pick English)
  const listenPicks = selectHouseVocabQuestions("listen", pool, plan.d, 2, 10)
    .map(q=>finalizeHouseVocabQuestion(q, pool));
  listenPicks.forEach(q=>qs.push(q));

  const questions = shuffle(qs);
  cur.max += quizWords.length + questions.length;

  let i=0;
  const stage = $("#stage");
  setSubStage(0, 2);
  function runMatching(){
    const left=shuffle(quizWords), right=shuffle(quizWords);
    let selected=null, matched=0;
    const missedIds={};
    stage.innerHTML=`
      <p class="lead">🔗 ${plan.title}</p>
      <p class="sub">First, match ${quizWords.length} covered La Casa words. Tap either side first.</p>
      <div class="qcount">Matching round · ${quizWords.length} pairs</div>
      <div class="match" id="hqMatch"></div>`;
    const wrap=$("#hqMatch");
    const colL=document.createElement("div"); const colR=document.createElement("div");
    colL.style.display=colR.style.display="grid"; colL.style.gap=colR.style.gap="10px";
    function choose(btn){
      if(btn.classList.contains("ok")) return;
      if(btn.dataset.side==="es") speak(btn.dataset.word);
      if(!selected){
        selected=btn;
        btn.classList.add("sel");
        return;
      }
      if(selected===btn) return;
      if(selected.dataset.side===btn.dataset.side){
        selected.classList.remove("sel");
        selected=btn;
        btn.classList.add("sel");
        return;
      }
      const first=selected;
      selected=null;
      if(first.dataset.id===btn.dataset.id){
        SFX.right();
        first.classList.add("ok"); btn.classList.add("ok");
        first.classList.remove("sel"); btn.classList.remove("sel");
        matched++;
        if(!missedIds[first.dataset.id]) cur.score++;
        if(matched===quizWords.length){
          toast("All matched! 🎉");
          setSubStage(1, 2);
          setTimeout(draw, 650);
        }
      } else {
        missedIds[first.dataset.id]=true;
        missedIds[btn.dataset.id]=true;
        SFX.wrong(); sayOops();
        first.classList.add("bad"); btn.classList.add("bad");
        setTimeout(()=>{
          first.classList.remove("bad","sel");
          btn.classList.remove("bad","sel");
        },400);
      }
    }
    left.forEach(v=>{
      const b=document.createElement("button");
      b.className="mtile"; b.dataset.id=v.id; b.dataset.side="es"; b.dataset.word=v.es;
      b.textContent=v.es;
      b.onclick=()=>choose(b);
      colL.appendChild(b);
    });
    right.forEach(v=>{
      const b=document.createElement("button");
      b.className="mtile"; b.dataset.id=v.id; b.dataset.side="en"; b.dataset.word=v.es;
      b.innerHTML=`<span class="em">${v.em}</span>${v.en}`;
      b.onclick=()=>choose(b);
      colR.appendChild(b);
    });
    wrap.appendChild(colL); wrap.appendChild(colR);
  }
  function draw(){
    const q = questions[i];
    let missed=false, pushed=false, done=false;
    const wrongState={wrongAttempts:0};
    stage.innerHTML=`
      <p class="lead">🎯 ${plan.title}</p>
      <p class="sub">${plan.theme || "Level 4 quiz"}</p>
      <div class="qcount">Question ${i+1} of ${questions.length}</div>
      <div class="q">
        <div class="em">${q.em}</div>
        <div class="ask">${q.ask}</div>
        ${q.kind==="listen"?`<button class="bigspeak" id="hqSpeak" style="margin:6px auto">🔊</button>`:""}
        <div style="margin-top:10px"><button class="hint-btn" id="hqHintBtn" type="button">💡 Need a hint?</button></div>
        <div class="hint-text" id="hqHintText" hidden>${q.hint}</div>
      </div>
      <div class="opts" id="opts"></div>`;
    if(q.kind==="listen"){ $("#hqSpeak").onclick=()=>speak(q.speak); setTimeout(()=>speak(q.speak), 250); }
    const hb=$("#hqHintBtn"); if(hb) hb.onclick=()=>{ missed=true; cur.hintUsedInLesson=true; const t=$("#hqHintText"); if(t){t.hidden=false;} hb.style.display="none"; setTimeout(()=>{ if(t) t.hidden=true; hb.style.display=""; },1500); };
    const o=$("#opts");
    q.opts.forEach(txt=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=txt;
      b.onclick=()=>{
        if(done||b.classList.contains("no"))return;
        if(txt===q.correct){
          done=true; b.classList.add("ok"); SFX.right(); cur.score++; noteCombo();
          if(!missed){
            if(q.sentenceQuestion) cur.houseSentenceCleanWin=(cur.houseSentenceCleanWin||0)+1;
            if(q.listeningQuestion) cur.houseListenCleanWin=(cur.houseListenCleanWin||0)+1;
          }
          if(missed && !pushed){ cur.redoQueue.push({prompt:q.ask, opts:q.opts, correct:q.correct, hint:q.hint, speak:q.speak}); pushed=true; }
          if(q.speak) speak(q.speak);
          setTimeout(()=>{ if(i<questions.length-1){ i++; draw(); } else { toast("Quiz done! 🎯"); setTimeout(nextStage, 650); } }, 750);
        } else { missed=true; b.classList.add("no"); if(secondWrongAdvance(wrongState, ()=>{ done=true; if(i<questions.length-1){ i++; draw(); } else { toast("Quiz done! 🎯"); setTimeout(nextStage, 650); } })) done=true; }
      };
      o.appendChild(b);
    });
  }
  runMatching();
}

/* Pick sentence/fill prompts from a large authored/generated bank.
   Day-based strides keep lesson and quiz sentence prompts from repeating across Level 4. */
function pickHouseSentences(day, n, availableWords){
  function key(it){ return `${it.pre}___${it.post}`; }
  function introducedThrough(d){
    const ids=new Set();
    LEVEL4_LESSONS.filter(x=>x.d<=d).forEach(x=>(x.newV||[]).forEach(id=>ids.add(id)));
    return ids;
  }
  function pickFor(d, count, allowed, used){
    const slotsBefore=LEVEL4_LESSONS
      .filter(x=>x.d<d)
      .reduce((sum,x)=>sum+(x.type==="quiz"?3:5),0);
    const out=[];
    const localUsed=new Set();
    for(let k=slotsBefore; k<LEVEL4_SENTENCE_BANK.length && out.length<count; k++){
      const it=LEVEL4_SENTENCE_BANK[k];
      const kIt=key(it);
      if(used.has(kIt) || localUsed.has(kIt)) continue;
      if(!it.ids || !it.ids.length || it.ids.every(id=>allowed.has(id))){ out.push(it); localUsed.add(kIt); }
    }
    for(let k=0; k<LEVEL4_SENTENCE_BANK.length && out.length<count; k++){
      const it=LEVEL4_SENTENCE_BANK[k];
      const kIt=key(it);
      if(out.includes(it) || used.has(kIt) || localUsed.has(kIt)) continue;
      if(!it.ids || !it.ids.length || it.ids.every(id=>allowed.has(id))){ out.push(it); localUsed.add(kIt); }
    }
    if(out.length<count){
      for(let k=slotsBefore; k<LEVEL4_SENTENCE_BANK.length && out.length<count; k++){
        const it=LEVEL4_SENTENCE_BANK[k];
        const kIt=key(it);
        if(!out.includes(it) && !used.has(kIt) && !localUsed.has(kIt)){ out.push(it); localUsed.add(kIt); }
      }
    }
    return out;
  }
  const used=new Set();
  LEVEL4_LESSONS.filter(x=>x.d<day).forEach(prev=>{
    const count=prev.type==="quiz"?3:5;
    const prevAllowed=introducedThrough(prev.d);
    pickFor(prev.d, count, prevAllowed, used).forEach(it=>used.add(key(it)));
  });
  const allowed=new Set((availableWords&&availableWords.length?availableWords:houseAvailable()).map(v=>v.id));
  return pickFor(day, n, allowed, used);
}

function renderBloom(st){
  // stars from score vs max (the scoring games set score/max). If no scoring game, give 3.
  // Global thresholds: <25% not done (0★), 25-50% 1★, 50-75% 2★, 75+% 3★.
  let stars=starsForScore(cur.score, cur.max);
  cur.earnedStars=stars;
  const isBonus=!!cur.plan.bonus;
  // Warm, never-discouraging messages — even 1 star feels good (#4)
  const msgs={
    3:["¡Increíble, Kabir! You're a star! 🌟","Perfect! You grew a strong plant! 💚","Wow! Three stars! ¡Súper! 🌻"],
    2:["¡Muy bien! Almost perfect! 🌱","Great job! So close to three stars! 🌼","Nice work, Kabir! Keep growing! 🌿"],
    1:["Good try! Every word helps you grow! 🌱","You did it! Practice makes perfect! 💪","Well done for finishing! Try again for more stars! 🌟"],
    0:["Let's try again — you've got this! 💪","Practice a little more and try once more! 🌱","Don't give up, Kabir — you'll grow with practice! 🌟"]
  };
  const headline=isBonus
    ? (stars===3? "🌳 You grew a TREE! 🌳" : "Bonus complete! 🌳")
    : (stars===0? `Lesson ${cur.plan.d} — try again 🔁`
       : stars===3? "🌱 You grew a sapling! 🌱"
       : `Lesson ${cur.plan.d} done!`);
  const bigIcon=isBonus? "🌳" : flowerFor(cur.plan.d);
  const stage=$("#stage");
  stage.innerHTML=`
    <div class="bloom ${isBonus?'bonus-bloom':''}">
      <div class="flower ${isBonus?'tree-grow':''}">${bigIcon}</div>
      <h2>${headline}</h2>
      <div class="starline">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <p>${cur.max>0? `You got ${cur.score} of ${cur.max} right. `:""}${msgs[stars][Math.floor(Math.random()*msgs[stars].length)]}</p>
    </div>`;
  const d=cur.plan.d;
  if(stars>0) saveDayProgress(stars);
  if($("#viewLevel").style.display!=="none") renderDash();
  function retryLesson(){ closeDay(); openDay(d); }
  function finishLesson(){
    stageBottom(null);
    if(stars===0){ closeDay(); return; }
    const trophies=(cur && cur.newlyEarnedTrophies) || [];
    if(!trophies.length){ commitDay(stars); return; }
    if(cur) cur.newlyEarnedTrophies=[]; // clear so we don't re-show on any subsequent click
    // Sequential celebration for each newly-earned trophy, then finish commitDay
    showTrophyChain(trophies.slice(), ()=>commitDay(stars));
  }
  if(stars===0){
    stageBottom({label:"🔁 Try again",onClick:retryLesson,secondary:{label:"Back to lessons",onClick:finishLesson}});
  } else {
    stageBottom({
      label:"Back to lessons 🌿",onClick:finishLesson,
      secondary:stars<3?{label:"Try again for 3 stars",onClick:retryLesson}:null
    });
  }
  confetti(32);
  if(isBonus){
    // Extra-special celebration for the tree (#5)
    setTimeout(()=>confetti(),350);
    setTimeout(()=>confetti(),700);
    speak(stars===3?"¡Increíble!":"¡Muy bien!");
  }
  // Combo streak bonus — celebrate a big consecutive-correct run.
  const mx = cur && cur._maxCombo || 0;
  if(mx >= 5){
    const msg = mx>=20 ? `👑 ${mx}x MEGA COMBO!` : mx>=10 ? `💥 ${mx}x COMBO — legendary!` : `🔥 Longest streak: ${mx}x`;
    setTimeout(()=>{ toast(msg); if(mx>=10) confetti(30); else pixieConfetti(14); }, 900);
  }
}

function saveDayProgress(stars){
  const d=cur.plan.d;
  const st=lvState(LVID);
  const wasCompleted=!!st.completed[d];
  // <25% (0★) leaves the lesson/activity marked "not done" so Kabir retries it.
  if(stars===0) return;
  if(cur._progressSavedThisRun){
    st.stars[d]=Math.max(st.stars[d]||0, stars);
    Store.save();
    return;
  }
  cur._progressSavedThisRun=true;
  st.completed[d]=true;
  st.stars[d]=Math.max(st.stars[d]||0, stars);
  // Level 4 · La Casa persistent counters (drive trophy checks)
  if(cur.plan && cur.plan.house){
    st.house = st.house || {sentenceCleanWin:0, listenCleanWin:0, noHint3Star:false, quizDaysDone:{}, lessonsDone:{}, quiz3Star:0};
    st.house.sentenceCleanWin += (cur.houseSentenceCleanWin||0);
    st.house.listenCleanWin   += (cur.houseListenCleanWin||0);
    const isQuiz = cur.plan.houseType==="quiz";
    if(isQuiz){
      if(!st.house.quizDaysDone[d]){ st.house.quizDaysDone[d]=true; }
      if(stars===3 && !cur.hintUsedInLesson) st.house.noHint3Star=true;
      if(stars===3 && !(cur.plan._alreadyCountedForQuiz3Star)){ st.house.quiz3Star = (st.house.quiz3Star||0)+1; cur.plan._alreadyCountedForQuiz3Star=true; }
    } else {
      st.house.lessonsDone[d]=true;
    }
  }
  learnedUpTo(d).forEach(id=>{ if(!st.collected.includes(id)) st.collected.push(id); });
  // streak (global, per calendar day)
  const tk=todayKey();
  if(STATE.lastDate!==tk){
    const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
    STATE.streak = (STATE.lastDate===y)? (STATE.streak||0)+1 : 1;
    STATE.lastDate=tk;
  }
  STATE.levelDailyDone=STATE.levelDailyDone||{};
  STATE.levelDailyDone[LVID]=tk;
  const crossLevelRevived = markDailyLevelActivity(LVID, `level:${LVID}:day:${d}`);
  // Any completed lesson brings every plan back to life — no revival coupon needed.
  const wasWithered = saplingsWithered();
  reviveAllLevelsForToday();
  if(crossLevelRevived && cur){
    cur.crossLevelRevived=true;
    setTimeout(()=>{
      confetti(50);
      toast("Three levels today! Every garden is alive again 🌱🌸🌳");
    }, 250);
  } else if(wasWithered && cur){
    setTimeout(()=>{
      confetti(30);
      toast("Your gardens are alive again 🌱✨");
    }, 250);
  }
  const newlyEarnedNow = checkTrophies();
  if(cur && newlyEarnedNow && newlyEarnedNow.length){
    cur.newlyEarnedTrophies = (cur.newlyEarnedTrophies||[]).concat(newlyEarnedNow);
  }
  if(!wasCompleted) recordGlobalCompletion(`level:${LVID}:day:${d}`);
  Store.save();
}

function commitDay(stars){
  endSession();
  saveDayProgress(stars);
  // If a revival coupon is active, mark this level's chapter complete.
  try{
    const outcome = markLevelChapterDone(LVID);
    if(outcome==="redeemed"){
      toast("🎁 Coupon complete! Garden revived 🌱🌸🌳");
    } else if(outcome===true){
      const rc = STATE.revive && STATE.revive.active;
      if(rc){
        const remaining = rc.need.filter(n=>!n.done).map(n=>n.name).join(" · ");
        toast("Coupon progress! Still needed: " + remaining);
      }
    }
  }catch(e){}
  // Auto-save a backup at every bonus milestone so progress is never lost (#2)
  if(cur.plan.bonus){
    try{
      const code=btoa(unescape(encodeURIComponent(JSON.stringify(STATE))));
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code)
          .then(()=>toast("🌳 Progress saved & backup copied — ask a parent to keep it safe!"))
          .catch(()=>toast("🌳 Tree earned! Tap 'Backup code' below to save your progress."));
      } else {
        toast("🌳 Tree earned! Tap 'Backup code' below to save your progress.");
      }
    }catch(e){}
  }
  closeDay();
  renderDash();
  maybeShowSurpriseQuiz();
  if(d===totalLessons()){ setTimeout(()=>{ confetti(); toast(`¡Felicidades! You finished ${LV.name}! 🎉`); },200); }
}

/* Learned-verbs popup — header tiles show regular vs irregular progress separately. */
function showLearnedVerbs(levelId){
  stageBottom(null);
  $("#overlay").classList.remove("lesson-active","sticky-action-enabled");
  const rows=[];
  for(const lid in STATE.levels){
    if(levelId && String(lid)!==String(levelId)) continue;
    const s=STATE.levels[lid];
    const lv=LEVELS.find(l=>String(l.id)===String(lid));
    if(!lv) continue;
    (s.collected||[]).forEach(id=>{
      const v=lv.verbs.find(x=>x.id===id);
      if(v) rows.push({lv, v});
    });
  }
  // de-dupe by the Spanish label; verbs use .inf, vocab items use .es
  const seen=new Set();
  const unique=rows.filter(r=>{ const k=r.v.inf||r.v.es; if(seen.has(k)) return false; seen.add(k); return true; });
  const lid = String(levelId||"1");
  const meta = lid==="0"
    ? {title:"Vocab Fiesta words learned",emoji:"🎉", unit:"word", where:"Level 0"}
    : lid==="4"
    ? {title:"La Casa words learned",     emoji:"🏠", unit:"word", where:"Level 4"}
    : lid==="2"
    ? {title:"Irregular verbs learned",   emoji:"⚡", unit:"verb", where:"Level 2"}
    : {title:"Regular verbs learned",     emoji:"🌷", unit:"verb", where:"Level 1"};
  $("#dvEmoji").textContent=meta.emoji;
  $("#dvTitle").textContent=meta.title;
  $("#dvSub").textContent=unique.length+" "+(unique.length===1?meta.unit:meta.unit+"s")+" so far — tap any to hear it!";
  $("#steps").innerHTML="";
  const stage=$("#stage");
  if(unique.length===0){
    stage.innerHTML=`<p class="lead" style="text-align:center">No ${meta.unit}s yet 🌱</p><p class="sub" style="text-align:center">Finish a ${meta.where} lesson to start this list.</p>`;
  } else {
    stage.innerHTML=`<div class="vlist" id="vlist"></div>`;
    const wrap=$("#vlist");
    unique.forEach(({v})=>{
      const row=document.createElement("button"); row.className="vrow"; row.type="button";
      row.innerHTML=`<span class="em">${v.em}</span><span class="meta"><span class="es">${v.es}</span><br><span class="en">${v.en}</span></span><span style="font-size:18px">🔊</span>`;
      row.onclick=()=>{ SFX.pop(); speak(v.inf || v.es); };
      wrap.appendChild(row);
    });
  }
  $("#overlay").classList.add("show");
  document.body.style.overflow="hidden";
  cur=null; // ensure closing the overlay doesn't try to commit a lesson
}

function renderSurpriseQuiz(learnedRows){
  stageBottom(null);
  $("#overlay").classList.remove("lesson-active","sticky-action-enabled");
  cur=null;
  endSession();
  const rows=shuffle(learnedRows.slice());
  const chunks=[];
  for(let i=0;i<rows.length;i+=10) chunks.push(rows.slice(i,i+10));
  let round=0, totalMatched=0;
  $("#dvEmoji").textContent="🎁";
  $("#dvTitle").textContent="Surprise quiz!";
  $("#dvSub").textContent=`Every 4 completions unlocks a quick review · ${rows.length} learned verbs`;
  $("#steps").innerHTML="";
  $("#overlay").classList.add("show");
  document.body.style.overflow="hidden";

  function finish(){
    STATE.surpriseQuiz.pending=false;
    STATE.surpriseQuiz.lastFinishedAt=new Date().toISOString();
    Store.save();
    $("#stage").innerHTML=`
      <div class="bloom bonus-bloom">
        <div class="flower tree-grow">🎁</div>
        <h2>Surprise quiz complete!</h2>
        <div class="starline">⭐⭐⭐</div>
        <p>You matched ${totalMatched} learned verb${totalMatched===1?"":"s"} from regular and irregular practice.</p>
        <button class="btn leaf big" id="surpriseDone">Back to learning 🌿</button>
      </div>`;
    confetti(40);
    $("#surpriseDone").onclick=()=>{ closeDay(); renderLevels(); };
  }

  function drawRound(){
    const group=chunks[round];
    const left=shuffle(group.slice());
    const right=shuffle(group.slice());
    let selected=null, matched=0;
    const stage=$("#stage");
    stage.innerHTML=`
      <p class="lead">Match all learned verbs 🔗</p>
      <p class="sub">Surprise round ${round+1} of ${chunks.length} · ${group.length} verb${group.length===1?"":"s"}</p>
      <div class="match" id="surpriseMatch"></div>`;
    const wrap=$("#surpriseMatch");
    const colL=document.createElement("div");
    const colR=document.createElement("div");
    colL.style.display=colR.style.display="grid";
    colL.style.gap=colR.style.gap="10px";
    function handleSurpriseTap(b, v){
      if(b.classList.contains("ok")) return;
      if(b.dataset.side==="l") speak(v.inf);
      if(!selected || selected.dataset.side===b.dataset.side){

/* Derive {current, target, pct} for a locked trophy by inspecting its check() source.
   Recognizes s.field >= N and s.field > N patterns; returns null for boolean flags. */
function trophyProgress(t, snap){
  try{
    const src = t.check.toString();
    const m = src.match(/s\.([A-Za-z0-9_]+)\s*(>=|>)\s*(\d+)/);
    if(!m) return null;
    const field = m[1];
    let target = Number(m[3]);
    if(m[2]===">") target = target + 1;
    if(!target || target<=0) return null;
    let current = Number(snap[field]);
    if(!isFinite(current) || current<0) current = 0;
    const capped = Math.min(current, target);
    return {current: capped, target, pct: capped/target};
  }catch(e){ return null; }
}
/* ============================================================
   Wi-Fi sync with the iOS app (see /ios folder)
   Endpoints on the iPhone: GET /state, POST /state, GET /ping
   ============================================================ */
function syncMergeState(remote, local){
  const out = JSON.parse(JSON.stringify(local || {}));
  if(!remote) return out;
  // Copy any top-level keys from remote that don't exist locally (forward-compat).
  Object.keys(remote).forEach(k=>{
    if(!(k in out) && k!=="levels" && k!=="trophies" && k!=="verbStats"
       && k!=="practiceRegular" && k!=="spanishHW" && k!=="surpriseQuiz"
       && k!=="sessionMinutes" && k!=="missHistory" && k!=="streak" && k!=="lastDate"){
      try{ out[k] = JSON.parse(JSON.stringify(remote[k])); }catch(e){ out[k] = remote[k]; }
    }
  });
  // Per-level completed / stars / collected + house counters
  out.levels = out.levels || {};
  for(const lid in (remote.levels||{})){
    const r = remote.levels[lid] || {};
    const o = out.levels[lid] = out.levels[lid] || {completed:{}, stars:{}, collected:[]};
    for(const d in (r.completed||{})) if(r.completed[d]) o.completed[d] = true;
    for(const d in (r.stars||{})) o.stars[d] = Math.max(o.stars[d]||0, r.stars[d]||0);
    const seen = new Set(o.collected||[]);
    (r.collected||[]).forEach(id=>seen.add(id));
    o.collected = Array.from(seen);
    // Preserve any per-level fields we don't explicitly merge (forward-compat).
    Object.keys(r).forEach(k=>{
      if(!(k in o) && k!=="completed" && k!=="stars" && k!=="collected" && k!=="basics" && k!=="house"){
        try{ o[k] = JSON.parse(JSON.stringify(r[k])); }catch(e){ o[k] = r[k]; }
      }
    });
    if(r.house){
      o.house = o.house || {sentenceCleanWin:0, listenCleanWin:0, noHint3Star:false, quizDaysDone:{}, lessonsDone:{}, quiz3Star:0};
      o.house.sentenceCleanWin = Math.max(o.house.sentenceCleanWin||0, r.house.sentenceCleanWin||0);
      o.house.listenCleanWin   = Math.max(o.house.listenCleanWin||0,   r.house.listenCleanWin||0);
      o.house.quiz3Star        = Math.max(o.house.quiz3Star||0,        r.house.quiz3Star||0);
      if(r.house.noHint3Star) o.house.noHint3Star = true;
      Object.assign(o.house.quizDaysDone = o.house.quizDaysDone||{}, r.house.quizDaysDone||{});
      Object.assign(o.house.lessonsDone  = o.house.lessonsDone||{},  r.house.lessonsDone||{});
    }
  }
  // Trophies: keep the earliest earnedAt
  out.trophies = out.trophies || {};
  for(const id in (remote.trophies||{})){
    const rem = remote.trophies[id], loc = out.trophies[id];
    if(!loc || (rem.earnedAt||"") < (loc.earnedAt||"")) out.trophies[id] = rem;
  }
  // Streak: keep the higher; lastDate: keep the later
  out.streak = Math.max(out.streak||0, remote.streak||0);
  if((remote.lastDate||"") > (out.lastDate||"")) out.lastDate = remote.lastDate;
  // Verb stats: max attempts / correct per verb
  out.verbStats = out.verbStats || {};
  for(const k in (remote.verbStats||{})){
    const r = remote.verbStats[k], o = out.verbStats[k] || {attempts:0, correct:0};
    o.attempts = Math.max(o.attempts||0, r.attempts||0);
    o.correct  = Math.max(o.correct||0,  r.correct||0);
    out.verbStats[k] = o;
  }
  // Practice tests / HW / surprise quiz — per-key OR/max
  ["practiceRegular","spanishHW"].forEach(key=>{
    if(!remote[key]) return;
    out[key] = out[key] || {completed:{}, stars:{}};
    for(const k in (remote[key].completed||{})) if(remote[key].completed[k]) out[key].completed[k] = true;
    for(const k in (remote[key].stars||{})) out[key].stars[k] = Math.max(out[key].stars[k]||0, remote[key].stars[k]||0);
  });
  if(remote.surpriseQuiz){
    out.surpriseQuiz = out.surpriseQuiz || {};
    const rf = remote.surpriseQuiz.lastFinishedAt;
    if(rf && (!out.surpriseQuiz.lastFinishedAt || rf > out.surpriseQuiz.lastFinishedAt)) out.surpriseQuiz.lastFinishedAt = rf;
  }
  // Session minutes: max per calendar date
  if(remote.sessionMinutes){
    out.sessionMinutes = out.sessionMinutes || {};
    for(const d in remote.sessionMinutes) out.sessionMinutes[d] = Math.max(out.sessionMinutes[d]||0, remote.sessionMinutes[d]||0);
  }
  // Miss history: union per day
  if(remote.missHistory){
    out.missHistory = out.missHistory || {};
    for(const d in remote.missHistory) out.missHistory[d] = (out.missHistory[d]||[]).concat(remote.missHistory[d]||[]);
  }
  return out;
}

// Push the current HTML source to the iPhone so the iOS app runs the same
// build the browser is showing. The iPhone writes it to Documents/ and reloads.
async function pushHTMLToDevice(baseUrl){
  const base = baseUrl.replace(/\/+$/,"");
  // Read our own source. For file:// this only works if the file is
  // reachable via same-origin fetch — WKWebView & Safari allow it.
  let html;
  try{
    const res = await fetchTO(location.href, {}, 5000);
    if(!res.ok) throw new Error("HTTP "+res.status);
    html = await res.text();
  }catch(e){
    throw new Error("Couldn't read local HTML — "+e.message);
  }
  if(!html || html.length < 500) throw new Error("Local HTML looks empty.");
  let res2;
  try{
    res2 = await fetchTO(base+"/html", {
      method:"POST",
      headers:{"Content-Type":"text/html; charset=utf-8"},
      body: html
    }, 20000);
  }catch(e){
    if(e.name==="AbortError") throw new Error("Timed out sending HTML to iPhone.");
    throw new Error("Push to iPhone failed — "+e.message);
  }
  if(!res2.ok) throw new Error("Update rejected — HTTP "+res2.status);
  return { bytes: html.length };
}

// fetch with a hard timeout — otherwise unreachable IPs hang for 30+ seconds
function fetchTO(url, opts, ms){
  ms = ms || 6000;
  const ctl = new AbortController();
  const to  = setTimeout(()=>ctl.abort(), ms);
  return fetch(url, Object.assign({signal:ctl.signal, cache:"no-store"}, opts||{}))
    .finally(()=>clearTimeout(to));
}
const SYNC_STATE_KEY = "learn_verb_activity_v2";
const SYNC_BACKUP_KEY = "learn_verb_activity_v2_backup";
const SYNC_DEVICE_URL_KEY = "syncDeviceUrl";
function syncStoreGet(key){
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
function syncStoreSet(key, value, opts){
  try{
    window.localStorage.setItem(key, value);
    return true;
  }catch(e){
    if(!(opts && opts.quiet)){
      try{ toast("Storage is blocked, so sync could not save on this device."); }catch(_){}
    }
    return false;
  }
}
/* Called on whichever device RECEIVES a state push — merges incoming with
   current local instead of blindly overwriting, so nothing done on this side
   between the sender's GET and POST can be lost. Returns true on success.
   Also snapshots the previous state to `learn_verb_activity_v2_backup`. */
function syncMergeIncoming(remoteJson){
  try{
    const remote = remoteJson ? JSON.parse(remoteJson) : null;
    if(!remote) return false;
    let local = null;
    try{ local = JSON.parse(syncStoreGet(SYNC_STATE_KEY)||"null"); }catch(e){}
    // Backup the current state before overwriting (once per merge).
    const prev = syncStoreGet(SYNC_STATE_KEY);
    if(prev) syncStoreSet(SYNC_BACKUP_KEY, prev, {quiet:true});
    const merged = syncMergeState(remote, local);
    if(!syncStoreSet(SYNC_STATE_KEY, JSON.stringify(merged), {quiet:true})) return false;
    return true;
  }catch(e){ return false; }
}
try{ window.syncMergeIncoming = syncMergeIncoming; }catch(e){}

async function syncWithDevice(baseUrl){
  const base = baseUrl.replace(/\/+$/,"");
  // 1) Pull remote state
  let remoteRaw = null;
  try{
    const res = await fetchTO(base+"/state", {}, 8000);
    if(!res.ok) throw new Error("HTTP "+res.status);
    remoteRaw = await res.text();
  }catch(e){
    if(e.name==="AbortError") throw new Error("Timed out reaching iPhone at "+base+" (both devices on same Wi-Fi? App open on iPhone? Local Network allowed?).");
    throw new Error("Could not reach iPhone at "+base+"/state — "+e.message);
  }
  let remote = null;
  if(remoteRaw && remoteRaw!=="null"){
    try{ remote = JSON.parse(remoteRaw); }catch(e){ throw new Error("Remote state wasn't valid JSON."); }
  }
  // 2) Read local state
  let local = null;
  try{ local = JSON.parse(syncStoreGet(SYNC_STATE_KEY)||"null"); }catch(e){}
  // 3) Merge
  const merged = syncMergeState(remote, local);
  const mergedJson = JSON.stringify(merged);
  // 4) Write merged locally
  if(!syncStoreSet(SYNC_STATE_KEY, mergedJson)){
    throw new Error("Browser storage is blocked, so sync could not save progress here.");
  }
  // 5) Push merged to iPhone (they end up with identical state)
  const res2 = await fetchTO(base+"/state", {method:"POST", headers:{"Content-Type":"application/json"}, body:mergedJson}, 15000);
  if(!res2.ok) throw new Error("Push to iPhone failed — HTTP "+res2.status);
  return {
    localWrote: mergedJson.length,
    remoteBefore: remoteRaw ? remoteRaw.length : 0,
    trophies: Object.keys(merged.trophies||{}).length
  };
}
