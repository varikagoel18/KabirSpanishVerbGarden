    : `${remaining} more to go — you got this!`;

  openInfoPanel("🏆","Trophies",`${earnedCount} of ${total} collected`,`
    <div class="trv2">
      <div class="trv2-hero">
        <div class="trv2-ring">
          <svg viewBox="0 0 120 120">
            <defs>
              <linearGradient id="trv2grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#FFC64A"/>
                <stop offset="100%" stop-color="#F3629C"/>
              </linearGradient>
            </defs>
            <circle class="track" cx="60" cy="60" r="${R}"/>
            <circle class="fill" cx="60" cy="60" r="${R}"
              stroke-dasharray="${C.toFixed(2)}"
              stroke-dashoffset="${dashOffset.toFixed(2)}"/>
          </svg>
          <div class="num"><b>${earnedCount}</b><small>of ${total}</small></div>
        </div>
        <div class="trv2-heroText">
          <h4>${pct}% complete</h4>
          <p>${subMsg}</p>
        </div>
      </div>

      <div class="trv2-chips" id="trv2Chips">
        <button class="trv2-chip on" data-filter="all">All</button>
        <button class="trv2-chip" data-filter="earned">Unlocked (${earnedCount})</button>
        <button class="trv2-chip" data-filter="locked">Locked (${remaining})</button>
      </div>

      ${sectionsHTML}
    </div>`);

  const root = $("#stage").querySelector(".trv2");
  if(!root) return;

  // Filter chip behavior
  const chips = root.querySelectorAll(".trv2-chip");
  chips.forEach(chip=>{
    chip.onclick = ()=>{
      const f = chip.dataset.filter;
      chips.forEach(x=>x.classList.toggle("on", x===chip));
      root.querySelectorAll(".trv2-card").forEach(card=>{
        const s = card.dataset.state;
        const show = (f==="all") || (f===s);
        card.classList.toggle("hidden", !show);
      });
      // Hide sections with no visible cards
      root.querySelectorAll(".trv2-sec").forEach(sec=>{
        const anyVisible = !!sec.querySelector(".trv2-card:not(.hidden)");
        sec.style.display = anyVisible ? "" : "none";
      });
    };
  });

  // Earned-card click → celebration burst
  root.querySelectorAll(".trv2-card.earned").forEach(card=>{
    card.onclick = ()=>{
      const t = TROPHIES.find(x=>x.id===card.dataset.trophy);
      if(t) trophyRoomBurst(t, card);
    };
  });

  /* ---------- Trophy-room celebration ---------- */
  // Animate the ring from empty to filled on open
  const ringFill = root.querySelector(".trv2-ring .fill");
  if(ringFill){
    const finalOffset = ringFill.getAttribute("stroke-dashoffset");
    ringFill.setAttribute("stroke-dashoffset", C.toFixed(2));
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{ ringFill.setAttribute("stroke-dashoffset", finalOffset); });
    });
  }

  // Animate per-card progress bars from 0 to their target width
  root.querySelectorAll(".trv2-prog-bar > i").forEach((el,idx)=>{
    const p = Number(el.getAttribute("data-pct")||0);
    setTimeout(()=>{ el.style.width = p+"%"; }, 350 + Math.min(idx*18, 900));
  });

  // Opening burst: pixie dust + warm confetti
  setTimeout(()=>{ pixieConfetti(24); confetti(18); }, 120);
  if(earnedCount >= total && total>0){
    // Full collection — go big
    setTimeout(()=>trophyMegaBurst(), 300);
  }

  // Stagger-in trophy cards + stagger shine so all earned tiles don't shimmer in sync
  root.querySelectorAll(".trv2-card").forEach((card,idx)=>{
    card.style.opacity = "0";
    card.style.transform = "translateY(8px) scale(.96)";
    card.style.setProperty("--sd", ((idx%9)*0.45)+"s");
    setTimeout(()=>{
      card.style.transition = "opacity .35s ease, transform .35s cubic-bezier(.2,.9,.3,1.3)";
      card.style.opacity = "";
      card.style.transform = "";
    }, 220 + Math.min(idx*22, 900));
  });
}

$("#parentsBtn").onclick=renderParents;
$("#trophiesBtn").onclick=renderTrophies;
if($("#syncBtn")){
  // Sync is Mac-browser → iPhone-server only. Hide the button on the iPhone
  // itself, otherwise tapping it points at its own address and fails.
  const isMobileApp = /iPhone|iPad|iPod/.test(navigator.platform)
                   || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  if(isMobileApp){
    $("#syncBtn").style.display = "none";
  } else {
    $("#syncBtn").onclick = showSyncPanel;
  }
}

/* Header collapse (mobile). Always starts collapsed on page load;
   button toggles for the current session only, no persistence. */
(function(){
  const btn = $("#hdrToggleBtn"), hdr = $("#mainHeader");
  if(!btn || !hdr) return;
  function setCollapsed(on){
    hdr.classList.toggle("collapsed", on);
    btn.textContent = on ? "+" : "−";
    btn.setAttribute("aria-expanded", on ? "false" : "true");
    btn.setAttribute("aria-label", on ? "Expand header" : "Collapse header");
  }
  setCollapsed(true);   // default: collapsed on every load
  btn.onclick = ()=> setCollapsed(!hdr.classList.contains("collapsed"));
})();
$("#resetBtn").onclick=async ()=>{
  if(confirm("Reset all progress? Every level's stars and flowers will be cleared.")){
    await Store.reset(); STATE=Store.get(); ensureExtraState();
    $("#viewLevel").style.display="none"; $("#viewLevels").style.display="";
    renderLevels(); toast("Fresh start ready 🌱");
  }
};
$("#backupBtn").onclick=async ()=>{
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(STATE))));
  try{ await navigator.clipboard.writeText(code); toast("Backup code copied! 📋"); }
  catch(e){ prompt("Copy this backup code and keep it safe:", code); }
};
$("#restoreBtn").onclick=async ()=>{
  const code=prompt("Paste your backup code:");
  if(!code) return;
  try{
    const obj=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    Store.import(obj); STATE=Store.get(); ensureExtraState(); await Store.save();
    $("#viewLevel").style.display="none"; $("#viewLevels").style.display="";
    renderLevels(); toast("Progress restored! 🎉");
  }catch(e){ toast("Hmm, that code didn't work 😕"); }
};

/* One-time repair: rebuild each level's `collected` list from the lessons that were
   actually FINISHED. Prevents inflated verb counts from intros that were only viewed. */
function repairCollectedFromCompleted(){
  let changed=false;
  for(const lid in STATE.levels){
    const st=STATE.levels[lid]; const lv=LEVELS.find(l=>String(l.id)===String(lid));
    if(!lv) continue;
    const plan=planFor(lv);
    const real=new Set();
    for(const dk in (st.completed||{})){
      if(!st.completed[dk]) continue;
      const day=+dk;
      for(const p of plan){ if(p.d<=day) (p.newV||[]).forEach(id=>real.add(id)); }
    }
    const before=(st.collected||[]).slice().sort().join(",");
    st.collected=[...real];
    if(st.collected.slice().sort().join(",")!==before) changed=true;
  }
  return changed;
}

/* One-time reset: clear the completion state of Level 3 · Lesson 1 (user asked to redo it
   after the tense lesson structure was upgraded with paragraphs and difficulty tiers). */
function resetTenseLesson1Once(){
  if(STATE._tenseL3Reset_v2) return false;
  const st=STATE.levels && STATE.levels[3];
  if(st){
    if(st.completed) delete st.completed[1];
    if(st.stars) delete st.stars[1];
  }
  STATE._tenseL3Reset_v2=true;
  return true;
}

/* One-time reset: clear Level 4 · Day 4, the quiz immediately after lesson 3,
   so Kabir can take that quiz fresh after the Level 4 quiz cadence changed. */
function resetHouseQuizAfterLesson3Once(){
  if(STATE._houseQuizAfterLesson3Reset_v1) return false;
  const st=STATE.levels && STATE.levels[4];
  if(st){
    if(st.completed) delete st.completed[4];
    if(st.stars) delete st.stars[4];
    if(st.house && st.house.quizDaysDone) delete st.house.quizDaysDone[4];
  }
  const key="level:4:day:4";
  const q=STATE.surpriseQuiz;
  if(q && q.completedKeys && q.completedKeys[key]){
    delete q.completedKeys[key];
    q.completedCount=Math.max(0,(q.completedCount||1)-1);
  }
  STATE._houseQuizAfterLesson3Reset_v1=true;
  return true;
}

function runVersionedMigrations(){
  let changed=false;
  STATE.schemaVersion = STATE.schemaVersion || 0;
  if(STATE.schemaVersion < 1){
    changed = resetTenseLesson1Once() || changed;
    STATE.schemaVersion = 1;
  }
  if(STATE.schemaVersion < 2){
    changed = resetHouseQuizAfterLesson3Once() || changed;
    STATE.schemaVersion = 2;
  }
  return changed;
}

(async function init(){
  STATE = await Store.load();
  ensureExtraState();
  const repaired=repairCollectedFromCompleted();
  const migrated=runVersionedMigrations();
  const newly=checkTrophies(true);
  if(repaired || migrated || newly.length) await Store.save();
  applyGardenSettings();
  renderLevels();
  setTimeout(()=>{
    // Revival coupon takes priority — wilted saplings offer first.
    if(!maybeShowRevivalCoupon()) maybeShowSurpriseQuiz();
  }, 350);
})();
</script>
