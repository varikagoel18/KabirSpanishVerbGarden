<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Verb Garden">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2E7E50">
<title>Kabir's Verb Garden · Spanish Verbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --cream:#FFF8EE;
    --soil:#7A5C3E;
    --soil-dark:#5E4630;
    --leaf:#3FA46A;
    --leaf-dark:#2E7E50;
    --sun:#FFC23F;
    --sun-deep:#FF9F1C;
    --berry:#FF6B8A;
    --berry-dark:#E94f72;
    --sky:#6CC4E8;
    --sky-deep:#3FA0CC;
    --ink:#43332A;
    --ink-soft:#7A6A5E;
    --card:#FFFFFF;
    --ar:#FF6B8A;   /* AR family colour */
    --er:#FFB23F;   /* ER family colour */
    --ir:#5BB6E0;   /* IR family colour */
    --shadow:0 10px 24px rgba(94,70,48,.16);
    --shadow-sm:0 4px 12px rgba(94,70,48,.14);
    --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{
    /* Kill the pinch-zoom double-tap gesture on iOS Safari & WKWebView */
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  body{
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% -10%, #FFF4D8 0%, transparent 55%),
      linear-gradient(180deg,#FFF8EE 0%, #FBF0DC 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    /* Prevent iOS rubber-band scroll bleeding to the WebView chrome */
    overscroll-behavior-y:none;
    /* Only allow selecting inside content that needs it (see .selectable) */
    -webkit-user-select:none; user-select:none;
    /* Respect the iPhone notch / home indicator */
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    padding-bottom:env(safe-area-inset-bottom);
  }
  /* Buttons feel snappier when they can't be text-selected on long press */
  button,.cell,.stat,.mini-action{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  /* Input fields — keep selectable, and 16px+ font so iOS doesn't zoom on focus */
  input,textarea{-webkit-user-select:text;user-select:text;font-size:16px;}
  /* Any element that needs to scroll gets momentum scrolling on iOS */
  .overlay,.sheet,.stage,.trv2,.wrap{-webkit-overflow-scrolling:touch;}
  /* Hardware-accelerate the elements that animate often */
  .cell:active,.opt:active,.mtile:active,.trv2-card:active,.fcard,.confetti{will-change:transform;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;padding-top:calc(18px + env(safe-area-inset-top));}
  h1,h2,h3,.disp{font-family:'Baloo 2',cursive;margin:0;line-height:1.05;}
  button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;}

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(135deg,var(--leaf) 0%, var(--leaf-dark) 100%);
    color:#fff;border-radius:28px;padding:18px 20px;box-shadow:var(--shadow);
    position:relative;overflow:hidden;
  }
  header::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;
    background:radial-gradient(circle,var(--sun) 0%, transparent 70%);opacity:.35;}
  .brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  .brand .logo{font-size:34px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));}
  .brand h1{font-size:26px;font-weight:800;letter-spacing:.3px;}
  .brand p{margin:2px 0 0;font-weight:700;opacity:.92;font-size:13.5px;}
  .stats{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap;}
  .stat{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.28);
    border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(2px);}
  .stat.frozen{background:rgba(108,196,232,.24);border-color:rgba(255,255,255,.46);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24), 0 0 18px rgba(108,196,232,.25);}
  .stat.frozen .n{color:#E9FAFF;text-shadow:0 1px 0 rgba(0,0,0,.18);}
  .stat .n{font-family:'Baloo 2';font-weight:800;font-size:19px;}
  .stat .l{font-size:11px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px;}
  button.stat.stat-btn{color:#fff;cursor:pointer;font-family:'Nunito',sans-serif;transition:transform .1s, background .15s;}
  button.stat.stat-btn:hover{background:rgba(255,255,255,.28);}
  button.stat.stat-btn:active{transform:scale(.96);}
  .header-actions{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1;flex-wrap:wrap;}
  .mini-action{background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.3);
    border-radius:14px;padding:9px 12px;font-size:12.5px;font-weight:900;backdrop-filter:blur(2px);text-decoration:none;display:inline-flex;align-items:center;}
  .mini-action:active{transform:scale(.96);}
  /* Collapsible header — mobile only (narrow screens or the iOS WKWebView) */
  .header-toggle{display:none;}
  @media(max-width:640px){
    header{padding-right:52px;}
    .header-toggle{
      display:flex;align-items:center;justify-content:center;
      position:absolute;top:12px;right:12px;
      width:32px;height:32px;border-radius:50%;
      background:rgba(255,255,255,.22);color:#fff;
      border:1.5px solid rgba(255,255,255,.32);
      font-size:22px;line-height:1;padding:0 0 2px;font-weight:900;
      z-index:2;cursor:pointer;
      transition:background .15s, transform .1s;
      -webkit-tap-highlight-color:transparent;
    }
    .header-toggle:active{background:rgba(255,255,255,.32);transform:scale(.92);}
    header .stats, header .header-actions{
      max-height:600px;opacity:1;
      transition:max-height .35s cubic-bezier(.4,0,.2,1), opacity .2s ease, margin-top .35s ease;
      overflow:hidden;
    }
    header.collapsed{padding-bottom:14px;}
    header.collapsed .stats,
    header.collapsed .header-actions{
      max-height:0;opacity:0;margin-top:0;pointer-events:none;
    }
    header.collapsed .brand p{display:none;}
    header.collapsed .brand h1{font-size:20px;}
  }
  /* Verbs-learned popup */
  .vlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:60vh;overflow-y:auto;padding:4px;}
  .vlist .vrow{background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .1s;}
  .vlist .vrow:active{transform:scale(.97);}
  .vlist .vrow .em{font-size:24px;flex:0 0 auto;}
  .vlist .vrow .meta{flex:1;min-width:0;}
  .vlist .vrow .es{font-family:'Baloo 2';font-weight:800;font-size:16px;color:var(--ink);line-height:1.1;}
  .vlist .vrow .en{font-size:12px;font-weight:700;color:var(--ink-soft);}
  @media(max-width:480px){.vlist{grid-template-columns:1fr;}}
  .panel-grid{display:grid;gap:12px;}
  .panel-card{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-sm);}
  .panel-card h3{font-size:17px;color:var(--leaf-dark);margin-bottom:6px;}
  .metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .metric{background:#FFF7E2;border-radius:14px;padding:12px;text-align:center;font-weight:800;color:var(--ink-soft);}
  .metric b{display:block;font-family:'Baloo 2';font-size:25px;color:var(--berry-dark);line-height:1;}
  .mini-list{display:grid;gap:8px;}
  .mini-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F9F0E3;border-radius:12px;padding:9px 11px;font-weight:800;}
  .mini-row span{min-width:0;overflow-wrap:anywhere;}
  .mini-row small{display:block;color:var(--ink-soft);font-weight:800;}
  /* ---------- Trophy Room (revamped) ---------- */
  /* ---------- Trophy room v2 (dark, ring-based) ---------- */
  .trv2{
    --trv2-bg:#FFF7F0; --trv2-panel:#FFFFFF; --trv2-panel-2:#FFF6D9;
    position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,190,120,.55) 0%, transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(255,150,190,.50) 0%, transparent 42%),
      radial-gradient(circle at 8% 92%, rgba(150,220,180,.55) 0%, transparent 46%),
      radial-gradient(circle at 92% 88%, rgba(160,200,255,.50) 0%, transparent 42%),
      radial-gradient(circle at 50% 50%, rgba(255,240,200,.60) 0%, transparent 55%),
      linear-gradient(180deg,#FFF6E8 0%, #FFEFDF 100%);
    --trv2-border:rgba(60,45,20,.08); --trv2-border-strong:rgba(60,45,20,.16);
    --trv2-ink:#3B2E1E; --trv2-ink-soft:#7A6B58; --trv2-ink-mute:#A2957F;
    --trv2-accent:#FF9F1C; --trv2-accent2:#E85A9C;
    --trv2-earned:#2B8A3E; --trv2-earned-bg:#E6F6EA;
    --trv2-locked:#8A7A6A; --trv2-locked-bg:#F1EADA;
    background:var(--trv2-bg); color:var(--trv2-ink);
    border-radius:22px; padding:16px; display:grid; gap:14px;
    font-family:'Nunito',sans-serif;
  }
  .trv2 *{box-sizing:border-box;}
  .trv2-title{font-family:'Baloo 2',cursive; font-size:28px; margin:0 0 4px; color:var(--trv2-accent);
    background:linear-gradient(90deg,var(--trv2-accent),var(--trv2-accent2)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .trv2-title .icon{-webkit-text-fill-color:initial; margin-right:6px;}
  .trv2-hero{background:linear-gradient(135deg, var(--leaf), var(--leaf-dark));
    color:#fff; border:1px solid rgba(0,0,0,.08);
    border-radius:20px; padding:16px 20px; display:flex; align-items:center; gap:18px;
    box-shadow:0 8px 22px rgba(30,90,40,.28), inset 0 1px 0 rgba(255,255,255,.25);}
  .trv2-hero .trv2-ring .track{stroke:rgba(255,255,255,.22);}
  .trv2-hero .trv2-ring .num b{color:#FFF3A8;}
  .trv2-hero .trv2-ring .num small{color:rgba(255,255,255,.85);}
  .trv2-heroText h4{color:#fff !important;}
  .trv2-heroText p{color:rgba(255,255,255,.88) !important;}
  .trv2-ring{position:relative; flex:0 0 auto; width:120px; height:120px;}
  .trv2-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
  .trv2-ring .track{fill:none; stroke:rgba(60,45,20,.10); stroke-width:10;}
  .trv2-ring .fill{fill:none; stroke:url(#trv2grad); stroke-width:10; stroke-linecap:round;
    transition:stroke-dashoffset 1s cubic-bezier(.2,.9,.3,1.1);}
  .trv2-ring .num{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; line-height:1;}
  .trv2-ring .num b{font-family:'Baloo 2',cursive; font-size:32px; color:var(--trv2-accent);}
  .trv2-ring .num small{font-size:11px; color:var(--trv2-ink-soft); font-weight:700; margin-top:4px;}
  .trv2-heroText h4{font-family:'Baloo 2',cursive; font-size:28px; margin:0 0 6px; color:var(--trv2-ink);}
  .trv2-heroText p{margin:0; color:var(--trv2-ink-soft); font-size:14px; font-weight:600;}
  .trv2-chips{display:flex; gap:10px; flex-wrap:wrap;}
  .trv2-chip{background:transparent; border:1px solid var(--trv2-border-strong);
    border-radius:999px; padding:10px 20px; font-size:14px; font-weight:800; color:var(--trv2-ink-soft);
    cursor:pointer; transition:.15s;}
  .trv2-chip:hover{color:var(--trv2-ink); border-color:rgba(255,255,255,.22);}
  .trv2-chip.on{background:transparent; color:var(--trv2-accent); border-color:var(--trv2-accent); border-width:2px; padding:9px 19px;}
  .trv2-sec{display:grid; gap:10px;}
  .trv2-secHead{display:flex; align-items:center; justify-content:space-between;
    padding-top:10px; margin-top:2px;
    border-top:1px dashed var(--trv2-border-strong);}
  .trv2-secHead h5{margin:0; font-family:'Baloo 2',cursive; font-size:20px; color:var(--trv2-ink);}
  .trv2-secHead .count{background:var(--trv2-panel-2); color:#8a6b1c;
    border-radius:999px; padding:3px 10px; font-size:11.5px; font-weight:900;
    box-shadow:inset 0 -1px 0 rgba(60,45,20,.06);}
  .trv2-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
  .trv2-card{background:linear-gradient(180deg,#FFFFFF 0%, #FFFCF3 100%);
    border:1px solid var(--trv2-border-strong);
    border-radius:14px; padding:12px 8px 10px; display:flex; flex-direction:column;
    align-items:center; text-align:center; gap:5px; transition:transform .15s, box-shadow .15s, border-color .15s;
    position:relative; overflow:hidden;
    box-shadow:0 2px 4px rgba(60,45,20,.06), inset 0 1px 0 rgba(255,255,255,.9);}
  .trv2-card::after{content:""; position:absolute; left:0; right:0; top:0; height:3px;
    background:linear-gradient(90deg, transparent, rgba(255,159,28,.35), transparent);
    opacity:0; transition:opacity .2s;}
  .trv2-card.earned{border-color:rgba(255,120,80,.55);
    background:
      radial-gradient(120% 80% at 100% 0%, rgba(255,200,80,.45) 0%, transparent 55%),
      radial-gradient(120% 90% at 0% 100%, rgba(140,220,255,.35) 0%, transparent 55%),
      linear-gradient(155deg,#FF9AA2 0%, #FFB37A 35%, #FFDA6B 70%, #A0E6B4 100%);
    box-shadow:0 6px 14px rgba(255,120,80,.22), 0 2px 4px rgba(60,45,20,.08),
      inset 0 1px 0 rgba(255,255,255,.95), inset 0 -2px 0 rgba(200,80,60,.10);}
  .trv2-card.earned .nm{color:#4A1E00; text-shadow:0 1px 0 rgba(255,255,255,.55);}
  .trv2-card.earned .ds{color:#6B3A18;}
  .trv2-card.earned .trv2-pill.earned{background:rgba(255,255,255,.85); color:#1F7A2E;
    box-shadow:0 1px 3px rgba(60,45,20,.14);}
  .trv2-card.earned::after{opacity:.7;}
  .trv2-card.earned::before{content:""; position:absolute; inset:-30% -60%;
    background:linear-gradient(110deg, transparent 40%, rgba(255,220,120,.55) 50%, transparent 60%);
    transform:translateX(-100%); pointer-events:none;
    animation:trv2Shine 4.5s ease-in-out infinite; animation-delay:calc(var(--sd,0s));}
  @keyframes trv2Shine{
    0%{transform:translateX(-100%);} 55%{transform:translateX(100%);} 100%{transform:translateX(100%);}
  }
  .trv2-ring .num b{animation:trv2Pulse 2.4s ease-in-out infinite;}
  @keyframes trv2Pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.06);}}
  .trv2-card.earned:hover{transform:translateY(-3px);
    border-color:rgba(255,159,28,.65);
    box-shadow:0 10px 22px rgba(255,159,28,.18), 0 3px 6px rgba(60,45,20,.08), inset 0 1px 0 rgba(255,255,255,.95);}
  .trv2-card.earned{cursor:pointer;}
  .trv2-card.locked{background:linear-gradient(180deg,#FBF6EA 0%, #F3ECD8 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .trv2-card .em{font-size:32px; line-height:1; margin:2px 0 2px;
    filter:drop-shadow(0 2px 4px rgba(60,45,20,.15));}
  .trv2-card.locked .em{filter:grayscale(1) brightness(.55); opacity:.5;}
  .trv2-card .nm{font-family:'Baloo 2',cursive; font-size:15px; color:var(--trv2-ink); line-height:1.1;}
  .trv2-card.locked .nm{color:var(--trv2-ink-soft);}
  .trv2-card .ds{font-size:11px; color:var(--trv2-ink-soft); font-weight:600; line-height:1.3; min-height:28px;}
  .trv2-pill{border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:800;
    display:inline-flex; align-items:center; gap:3px; margin-top:3px;}
  .trv2-prog{width:100%; margin-top:4px; display:flex; flex-direction:column; gap:3px;}
  .trv2-prog-bar{height:6px; background:rgba(60,45,20,.10); border-radius:999px; overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(60,45,20,.08);}
  .trv2-prog-bar > i{display:block; height:100%; width:0;
    background:linear-gradient(90deg,#FFC64A,#FF9F1C);
    border-radius:999px; transition:width .8s cubic-bezier(.2,.9,.3,1.1);
    box-shadow:0 0 6px rgba(255,159,28,.35);}
  .trv2-prog-lbl{font-size:10px; font-weight:800; color:var(--trv2-ink-soft); letter-spacing:.2px;}
  .trv2-pill.earned{background:var(--trv2-earned-bg); color:var(--trv2-earned);}
  .trv2-pill.locked{background:var(--trv2-locked-bg); color:var(--trv2-locked);}
  .trv2-card.hidden{display:none;}
  @media (max-width:520px){
    .trv2{padding:14px;}
    .trv2-hero{padding:16px; gap:14px;}
    .trv2-ring{width:96px; height:96px;}
    .trv2-ring .num b{font-size:26px;}
    .trv2-heroText h4{font-size:22px;}
    .trv2-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
    .trv2-card{padding:14px 10px 12px;}
    .trv2-card .em{font-size:36px;}
    .trv2-card .nm{font-size:16px;}
  }

  .trophy-room{display:grid;gap:14px;}
  .trophy-hero{
    background:linear-gradient(135deg,#3F79E5 0%,#7A5CFF 45%,#E94F72 100%);
    color:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 12px 28px rgba(85,60,180,.28);
    overflow:hidden;position:relative;
  }
  .trophy-hero::before{content:"";position:absolute;inset:-40% -30% auto auto;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.45) 0%,transparent 68%);pointer-events:none;}
  .trophy-hero::after{content:"🏆";position:absolute;right:14px;top:12px;font-size:52px;opacity:.35;transform:rotate(-8deg);}
  .trophy-hero h3{font-size:26px;font-family:'Baloo 2',cursive;margin:0 0 2px;}
  .trophy-hero p{margin:0 0 12px;font-weight:800;opacity:.94;font-size:13px;letter-spacing:.2px;}
  .trophy-hero .th-count{font-family:'Baloo 2',cursive;font-size:44px;line-height:1;letter-spacing:.5px;}
  .trophy-hero .th-count small{font-size:18px;opacity:.8;font-weight:800;font-family:'Nunito',sans-serif;}
  .trophy-meter{height:12px;background:rgba(255,255,255,.28);border-radius:999px;overflow:hidden;margin-top:10px;position:relative;z-index:1;}
  .trophy-meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFC23F,#FF9F1C,#FFC23F);width:0;transition:width .75s cubic-bezier(.2,.9,.3,1.2);
    box-shadow:0 0 12px rgba(255,196,60,.85);}
  .trophy-cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1;}
  .trophy-cat-chip{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800;color:#fff;display:inline-flex;align-items:center;gap:5px;}
  .trophy-cat-chip .chip-count{background:#fff;color:var(--ink);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:900;}
  /* Category section */
  .trophy-section{border-radius:22px;padding:14px 14px 16px;box-shadow:var(--shadow-sm);
    background:var(--cat-tint,#fff);border:2px solid var(--cat-accent,#eee);position:relative;overflow:hidden;}
  .trophy-section::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.6) 0%,transparent 68%);pointer-events:none;}
  .trophy-section .sec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;z-index:1;}
  .trophy-section .sec-icon{font-size:28px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));}
  .trophy-section .sec-title{font-family:'Baloo 2',cursive;font-size:20px;color:var(--cat-accent,var(--ink));flex:1;}
  .trophy-section .sec-count{background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900;color:var(--cat-accent,var(--ink-soft));box-shadow:var(--shadow-sm);}
  .trophy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;position:relative;z-index:1;}
  /* Trophy card — richer, tier-ringed, animated */
  .trophy{background:#fff;border-radius:18px;padding:14px 12px;min-height:150px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
    box-shadow:0 6px 16px rgba(94,70,48,.14);
    animation:trophyCardIn .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--delay,0ms);}
  .trophy .tier-badge{position:absolute;top:8px;left:8px;background:var(--tier-bg,#e0e0e0);color:var(--tier-fg,#333);border-radius:999px;font-size:9.5px;font-weight:900;padding:2px 7px;letter-spacing:.6px;text-transform:uppercase;box-shadow:0 2px 4px rgba(0,0,0,.14);}
  .trophy[data-tier="bronze"]{  --tier-bg:linear-gradient(135deg,#CD7F32,#8C5424);--tier-fg:#fff;--ring:#CD7F32;}
  .trophy[data-tier="silver"]{  --tier-bg:linear-gradient(135deg,#D8D8D8,#9A9A9A);--tier-fg:#fff;--ring:#B8B8B8;}
  .trophy[data-tier="gold"]{    --tier-bg:linear-gradient(135deg,#FFD64C,#D48A00);--tier-fg:#fff;--ring:#FFC23F;}
  .trophy[data-tier="platinum"]{--tier-bg:linear-gradient(135deg,#B3E0FF,#7A5CFF 55%,#FF6B8A);--tier-fg:#fff;--ring:#7A5CFF;}
  .trophy .emblem{
    width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 25%, #fff 0%, #FFEED6 55%, #FFD68A 100%);
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.1), 0 0 0 4px #fff, 0 0 0 6px var(--ring,#DDD), 0 6px 14px rgba(0,0,0,.12);
    position:relative;overflow:visible;
  }
  .trophy .emblem .em{font-size:38px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));position:relative;z-index:1;}
  .trophy .name{font-family:'Baloo 2';font-weight:800;color:var(--ink);font-size:15px;line-height:1.1;margin-top:2px;}
  .trophy .desc{font-size:11.5px;font-weight:800;color:var(--ink-soft);line-height:1.25;}
  .trophy .stamp{font-size:10.5px;font-weight:900;color:var(--cat-accent,var(--leaf-dark));background:rgba(255,255,255,.75);border-radius:999px;padding:2px 8px;letter-spacing:.4px;margin-top:2px;}
  .trophy.earned{border:2px solid var(--ring,#FFC23F);cursor:pointer;}
  .trophy.earned::before{content:"";position:absolute;inset:-40% -65%;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);
    transform:translateX(-70%) rotate(9deg);animation:trophyShine 3.8s ease-in-out infinite;animation-delay:var(--delay,0ms);pointer-events:none;}
  .trophy.earned .emblem{animation:trophyBadgePulse 2.6s ease-in-out infinite;}
  .trophy.earned:active{transform:scale(.97);}
  .trophy.locked{background:linear-gradient(180deg,#F7F2E9 0%,#EEE7D6 100%);}
  .trophy.locked .emblem{background:radial-gradient(circle at 30% 25%,#F5EFE2 0%,#E1D9C7 100%);box-shadow:inset 0 -3px 6px rgba(0,0,0,.08), 0 0 0 4px #F7F2E9, 0 0 0 6px #D6CDB8, 0 4px 8px rgba(0,0,0,.06);}
  .trophy.locked .emblem .em{filter:none;opacity:.45;}
  .trophy.locked .name{color:var(--ink-soft);}
  .trophy.locked .desc{opacity:.85;}
  .trophy.locked .tier-badge{opacity:.6;}
  @keyframes trophyCardIn{from{transform:translateY(14px) scale(.94);opacity:0}to{transform:none;opacity:1}}
  @keyframes trophyShine{0%,45%{transform:translateX(-75%) rotate(9deg)}65%,100%{transform:translateX(75%) rotate(9deg)}}
  @keyframes trophyBadgePulse{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
  @media(max-width:480px){.metric-row,.trophy-grid{grid-template-columns:1fr;}}
  @media(min-width:640px){.trophy-grid{grid-template-columns:repeat(3,1fr);}}
  /* Hint reveal button (used in quiz questions) */
  .hint-btn{background:#FFF3D6;color:#a3650b;border:2px solid #FFD58A;border-radius:14px;padding:6px 12px;
    font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .hint-btn:active{transform:scale(.96);}
  .hint-text{font-size:12.5px;color:var(--berry-dark);font-weight:800;margin-top:8px;}
  /* Difficulty badges on tense quiz sentences */
  .diff-badge{display:inline-block;font-weight:900;font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px;letter-spacing:.3px;}
  .diff-badge.easy{background:#DDF5E5;color:#1e6a3a;}
  .diff-badge.med{background:#FFF3D6;color:#8a5b00;}
  .diff-badge.hard{background:#FFE0E6;color:#a52347;}
  /* Trophy popup */
  .trophy-popup{text-align:center;padding:8px 6px 4px;position:relative;overflow:hidden;}
  .trophy-popup .tp-rays{position:absolute;inset:4px;border-radius:22px;background:conic-gradient(from 0deg,rgba(255,194,63,.28),transparent 14%,rgba(108,196,232,.22) 28%,transparent 42%,rgba(255,107,138,.20) 58%,transparent 72%,rgba(255,194,63,.28));animation:tpRays 5s linear infinite;opacity:.85;}
  .trophy-popup .tp-badge{position:relative;display:inline-block;background:#fff;border:2px solid #FFD58A;border-radius:999px;padding:5px 13px;font-weight:900;color:#a3650b;box-shadow:var(--shadow-sm);}
  .trophy-popup .tp-em{position:relative;font-size:104px;animation:trophyPop .8s cubic-bezier(.2,1.6,.4,1), trophyBadgeBounce 2.2s ease-in-out .9s infinite;}
  @keyframes trophyPop{0%{transform:scale(0) rotate(-30deg);opacity:0}55%{transform:scale(1.3);opacity:1}75%{transform:scale(.9);}100%{transform:none}}
  @keyframes tpRays{to{transform:rotate(360deg)}}
  .trophy-popup .tp-name{font-family:'Baloo 2',cursive;color:var(--leaf-dark);font-size:26px;margin:6px 0 4px;}
  .trophy-popup .tp-desc{font-weight:800;color:var(--ink);margin:0 12px 6px;}
  .trophy-popup .tp-reason{font-size:13px;color:var(--ink-soft);font-weight:700;margin:0 12px 14px;}
  /* ---------- Deferred trophy celebration (from "Back to lessons") ---------- */
  .trophy-celebration{text-align:center;padding:6px 6px 4px;position:relative;overflow:hidden;}
  .trophy-celebration .tc-scene{position:relative;width:260px;height:230px;margin:6px auto 8px;}
  .trophy-celebration .tc-halo{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:230px;height:230px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,199,60,.55) 0%,rgba(180,120,255,.28) 45%,rgba(180,120,255,0) 72%);
    animation: tcHalo 2.4s ease-in-out infinite;
  }
  @keyframes tcHalo{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.75}50%{transform:translate(-50%,-50%) scale(1.18);opacity:1}}
  .trophy-celebration .tc-orbit{
    position:absolute;top:50%;left:50%;width:0;height:0;pointer-events:none;
    animation: tcOrbitRing 6s linear infinite;
  }
  @keyframes tcOrbitRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .trophy-celebration .tc-orbit .tc-orbit-em{
    position:absolute;font-size:24px;filter:drop-shadow(0 0 6px rgba(255,220,80,.9)) drop-shadow(0 0 12px rgba(180,120,255,.6));
    animation: tcEmSpin 3s linear infinite;
  }
  @keyframes tcEmSpin{from{transform:rotate(0deg) scale(.9)}50%{transform:rotate(180deg) scale(1.1)}to{transform:rotate(360deg) scale(.9)}}
  .trophy-celebration .tc-orbit .s1{transform:translate(-15px, -105px)}
  .trophy-celebration .tc-orbit .s2{transform:translate(85px, -55px)}
  .trophy-celebration .tc-orbit .s3{transform:translate(90px, 60px)}
  .trophy-celebration .tc-orbit .s4{transform:translate(-10px, 100px)}
  .trophy-celebration .tc-orbit .s5{transform:translate(-100px, 55px)}
  .trophy-celebration .tc-orbit .s6{transform:translate(-95px, -50px)}
  .trophy-celebration .tc-pixie{
    position:absolute;top:8px;right:16px;font-size:38px;transform-origin:70% 70%;
    animation: tcPixieFly 3.5s ease-in-out infinite;
    filter:drop-shadow(0 0 10px rgba(255,220,80,.85));
  }
  @keyframes tcPixieFly{
    0%{transform:translate(0,0) rotate(-8deg)}
    25%{transform:translate(-16px,10px) rotate(4deg)}
    50%{transform:translate(-30px,-8px) rotate(-4deg)}
    75%{transform:translate(-18px,12px) rotate(6deg)}
    100%{transform:translate(0,0) rotate(-8deg)}
  }
  .trophy-celebration .tc-trophy{
    position:absolute;top:50%;left:50%;font-size:120px;line-height:1;
    transform:translate(-50%,-50%);
    animation: tcTrophySpin 1.4s cubic-bezier(.25,1.5,.4,1) both, tcTrophyBob 3.5s ease-in-out 1.4s infinite;
    filter:drop-shadow(0 6px 14px rgba(150,110,10,.35));
  }
  @keyframes tcTrophySpin{
    0%{transform:translate(-50%,-50%) scale(0) rotate(-900deg);opacity:0}
    55%{transform:translate(-50%,-50%) scale(1.25) rotate(0deg);opacity:1}
    75%{transform:translate(-50%,-50%) scale(.92) rotate(20deg)}
    100%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  }
  @keyframes tcTrophyBob{0%,100%{transform:translate(-50%,-52%) rotate(-3deg)}50%{transform:translate(-50%,-48%) rotate(3deg)}}
  .trophy-celebration .tc-title{font-family:'Baloo 2',cursive;color:var(--sun-deep,#FF9F1C);font-size:24px;margin:6px 0 2px;}
  .trophy-celebration .tc-name{font-family:'Baloo 2',cursive;color:var(--leaf-dark);font-size:22px;margin:2px 12px 6px;}
  .trophy-celebration .tc-desc{font-weight:800;color:var(--ink-soft);margin:0 12px 16px;font-size:14px;}
  /* Sparkle confetti — bright warm-gold + violet glow, distinct from flower/butterfly confetti */
  .confetti.pixie{filter:drop-shadow(0 0 6px rgba(255,220,80,.9)) drop-shadow(0 0 12px rgba(180,120,255,.65));}
  /* ---------- Revival coupon ---------- */
  .coupon{position:relative;max-width:520px;margin:0 auto;padding:0;}
  .coupon-inner{background:linear-gradient(160deg,#FFF9E6 0%,#FFEECB 100%);border:3px dashed #E4A700;border-radius:22px;padding:18px 20px;box-shadow:0 14px 34px rgba(150,110,10,.28);position:relative;}
  .coupon-perf{position:absolute;left:-6px;top:38%;width:12px;height:24%;border-radius:0 12px 12px 0;background:var(--cream);box-shadow:0 8px 0 var(--cream),0 -8px 0 var(--cream),0 16px 0 var(--cream),0 -16px 0 var(--cream);}
  .coupon-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .coupon-tag{background:var(--berry);color:#fff;font-family:'Baloo 2',cursive;font-weight:800;font-size:15px;padding:5px 12px;border-radius:999px;letter-spacing:.5px;}
  .coupon-serial{font-family:'Nunito',sans-serif;font-weight:800;font-size:12px;color:#8a5b00;letter-spacing:1.2px;}
  .coupon-hero{text-align:center;margin:4px 0 14px;}
  .withered-row{display:flex;align-items:center;justify-content:center;gap:6px;font-size:34px;margin:8px 0 12px;}
  .withered-row .wither{filter:grayscale(.9) brightness(.85);opacity:.8;}
  .withered-row .arrow{font-size:26px;color:#a52347;font-weight:800;}
  .withered-row .alive{animation:sway 2.2s ease-in-out infinite;}
  .coupon-title{font-family:'Baloo 2',cursive;color:var(--berry-dark);font-size:22px;margin:4px 0 4px;}
  .coupon-sub{color:var(--ink);font-weight:700;font-size:14px;line-height:1.4;margin:0 4px;}
  .coupon-tasks{background:#fff;border:2px solid #FFD58A;border-radius:14px;padding:6px 10px;margin:12px 0;}
  .rc-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed #FFD58A;}
  .rc-row:last-child{border-bottom:0;}
  .rc-row .rc-check{font-size:18px;text-align:center;}
  .rc-row .rc-name{font-weight:800;color:var(--ink);font-size:14.5px;}
  .rc-row .rc-status{font-weight:800;font-size:12px;color:#8a5b00;text-transform:uppercase;letter-spacing:.4px;}
  .rc-row.done{background:#E6F6EA;border-radius:10px;}
  .rc-row.done .rc-name{color:var(--leaf-dark);}
  .rc-row.done .rc-status{color:var(--leaf-dark);}
  .coupon-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;margin-top:4px;}
  .coupon-fine{text-align:center;font-size:11px;color:#8a5b00;font-weight:700;margin-top:10px;letter-spacing:.3px;}
  .coupon-actions button[disabled]{opacity:.55;cursor:not-allowed;filter:grayscale(.35);}
  /* Sapling-cost wallet inside the coupon */
  .rc-wallet{background:#fff;border:2px solid #FFD58A;border-radius:14px;padding:12px 14px;margin:12px 0;}
  .rc-wallet.short{border-color:#F7B4BE;background:#FFF3F4;}
  .rc-wallet.ok{border-color:#8FD9A2;background:#F0FCEF;}
  .rc-wallet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px;}
  .rc-wallet-row + .rc-wallet-row{border-top:1px dashed rgba(0,0,0,.08);}
  .rc-wallet-label{font-weight:800;color:var(--ink);font-size:14px;}
  .rc-wallet-val{font-weight:900;font-size:15px;color:var(--ink);letter-spacing:.4px;}
  .rc-wallet-val b{font-family:'Baloo 2',cursive;font-size:20px;margin-left:2px;color:var(--leaf-dark);}
  .rc-wallet-val.low b{color:var(--berry-dark);}
  .rc-wallet-msg{margin-top:8px;font-weight:800;font-size:13px;line-height:1.35;text-align:center;padding:6px 6px 4px;border-radius:10px;}
  .rc-wallet-msg.good{color:var(--leaf-dark);background:#E6F6EA;}
  .rc-wallet-msg.short-msg{color:var(--berry-dark);background:#FFE0E6;}
  /* Withered saplings header state */
  .stat.stat-withered{opacity:.7;}
  .stat.stat-withered .n{color:#8a5b00;text-decoration:line-through;}
  .stat.stat-withered .l::after{content:" 🥀";}

  /* ---------- Garden plot ---------- */
  .section-title{display:flex;align-items:baseline;gap:10px;margin:24px 4px 12px;}
  .section-title h2{font-size:21px;font-weight:800;color:var(--leaf-dark);}
  .section-title span{font-size:13px;font-weight:700;color:var(--ink-soft);}

  .plot{
    background:linear-gradient(180deg,#caa173 0%, #b98c5c 100%);
    border-radius:26px;padding:16px;box-shadow:var(--shadow), inset 0 3px 0 rgba(255,255,255,.25);
    position:relative;
  }
  .plot::before{content:"";position:absolute;inset:8px;border-radius:20px;
    border:3px dashed rgba(255,255,255,.25);pointer-events:none;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;position:relative;}
  @media(max-width:520px){.grid{grid-template-columns:repeat(5,1fr);}}
  .cell{
    aspect-ratio:1/1;border-radius:16px;border:none;position:relative;
    background:linear-gradient(180deg,#6f5235 0%, #5b4029 100%);
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), inset 0 3px 6px rgba(0,0,0,.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;transition:transform .12s ease;
  }
  .cell:active{transform:scale(.94);}
  .cell .daynum{position:absolute;top:5px;left:7px;font-size:10.5px;font-weight:800;opacity:.65;}
  .cell .icon{font-size:22px;line-height:1;}
  .cell.locked{filter:saturate(.5) brightness(.92);}
  .cell.locked .icon{opacity:.5;}
  .cell.locked{cursor:not-allowed;}
  .cell.done{background:linear-gradient(180deg,#7FCF94 0%, #4FAF6B 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), var(--shadow-sm);}
  .cell.done .icon{font-size:26px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18));}
  .cell.done.drought{background:linear-gradient(180deg,#BCA17C 0%, #8F6C4A 100%);}
  .cell.done.drought .icon{filter:grayscale(.45) sepia(.45) drop-shadow(0 2px 1px rgba(0,0,0,.18));transform:rotate(-9deg) translateY(3px);}
  .cell.done.drought::after{content:"💧";position:absolute;right:3px;bottom:13px;font-size:12px;opacity:.75;filter:grayscale(.4);}
  .cell.bonus{background:linear-gradient(180deg,#FFD947 0%, #FF9F1C 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18), inset 0 3px 6px rgba(0,0,0,.1);}
  .cell.bonus.done{background:linear-gradient(180deg,#FFD947 0%, #e8900a 100%);}
  .cell.bonus.done.drought{background:linear-gradient(180deg,#A98E6D 0%, #73563B 100%);}
  .cell.bonus.today{background:linear-gradient(180deg,#FFE066 0%, #FFB830 100%);outline-color:#FF6B8A;}
  .cell.today{outline:3px solid var(--sun);outline-offset:1px;background:linear-gradient(180deg,#8a6743 0%, #6f5235 100%);}
  .cell.today .icon{animation:sway 2.4s ease-in-out infinite;}
  .cell .mini-stars{position:absolute;bottom:3px;font-size:8.5px;letter-spacing:-1px;}
  @keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .legend{display:flex;gap:14px;justify-content:center;margin-top:14px;flex-wrap:wrap;color:#fff;font-size:12px;font-weight:700;}
  .legend span{display:flex;align-items:center;gap:5px;}

  /* progress to-bloom bar */
  .grow{margin-top:16px;background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-sm);}
  .grow .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .grow h3{font-size:15px;color:var(--leaf-dark);}
  .grow .pct{font-family:'Baloo 2';font-weight:800;color:var(--berry-dark);}
  .bar{height:14px;border-radius:10px;background:#EFE3D2;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--leaf) 0%, var(--sun) 100%);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1);}

  /* ---------- Buttons ---------- */
  .btn{
    background:var(--berry);color:#fff;font-weight:800;font-size:17px;
    border-radius:16px;padding:14px 22px;box-shadow:0 5px 0 var(--berry-dark);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--berry-dark);}
  .btn.leaf{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-dark);}
  .btn.sun{background:var(--sun-deep);box-shadow:0 5px 0 #d97f00;color:#5b3a00;}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e3d4c0, inset 0 0 0 2px #efe2d2;}
  .btn.big{width:100%;font-size:19px;padding:16px;}
  .btn.sm{font-size:14px;padding:9px 14px;border-radius:12px;box-shadow:0 4px 0 var(--berry-dark);}

  /* ---------- Modal / day view ---------- */
  .overlay{position:fixed;inset:0;background:rgba(67,51,42,.55);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;z-index:50;padding:14px;overflow-y:auto;}
  .overlay.show{display:flex;}
  .sheet{
    background:var(--cream);border-radius:26px;max-width:560px;width:100%;margin:auto;
    box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden;animation:pop .25s cubic-bezier(.2,.9,.3,1.2);
  }
  /* Wider modal when the trophy room is showing */
  .overlay:has(.trv2) .sheet{max-width:1080px;}
  @keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .sheet-top{background:linear-gradient(135deg,var(--leaf),var(--leaf-dark));color:#fff;padding:16px 18px;
    display:flex;align-items:center;justify-content:space-between;}
  .sheet-top .d{display:flex;align-items:center;gap:11px;}
  .sheet-top .d .big{font-size:30px;}
  .sheet-top h2{font-size:19px;font-weight:800;}
  .sheet-top p{margin:1px 0 0;font-size:12.5px;font-weight:700;opacity:.9;}
  .closex{background:rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:800;line-height:1;}
  .steps{display:flex;gap:6px;padding:12px 18px 0;}
  .steps i{flex:1;height:7px;border-radius:5px;background:#E7D8C4;}
  .steps i.on{background:var(--sun);}
  .steps i.done{background:var(--leaf);}
  .stage{padding:18px;}
  .stage-bottom[hidden]{display:none!important;}
  .stage-bottom{position:relative;bottom:0;z-index:4;padding:10px 18px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid rgba(67,51,42,.1);background:rgba(255,248,238,.96);backdrop-filter:blur(10px);}
  .stage-bottom-inner{display:flex;align-items:center;justify-content:flex-end;gap:10px;max-width:524px;margin:0 auto;}
  .stage-bottom .btn{min-height:48px;margin:0;}
  .stage-bottom .stage-primary{flex:1 1 220px;}
  .stage-bottom .stage-secondary{flex:0 1 auto;min-width:96px;}
  .stage-bottom button:disabled{opacity:.55;box-shadow:none;transform:none;cursor:default;}
  @media(max-width:640px){
    .overlay.lesson-active.sticky-action-enabled{overflow:hidden;}
    .overlay.lesson-active.sticky-action-enabled .sheet{display:flex;flex-direction:column;
      max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);}
    .overlay.lesson-active.sticky-action-enabled .sheet-top,
    .overlay.lesson-active.sticky-action-enabled .steps,
    .overlay.lesson-active.sticky-action-enabled .stage-bottom{flex:0 0 auto;}
    .overlay.lesson-active.sticky-action-enabled .stage{flex:1 1 auto;min-height:0;overflow-y:auto;}
    .overlay.lesson-active.sticky-action-enabled .stage-bottom{position:sticky;margin-bottom:var(--keyboard-offset,0px);}
  }
  @media(prefers-reduced-transparency:reduce){
    .stage-bottom{background:rgba(46,126,80,.98);backdrop-filter:none;border-top-color:rgba(255,255,255,.28);}
  }
  .stage .lead{font-family:'Baloo 2';font-weight:700;font-size:18px;color:var(--leaf-dark);margin:0 0 4px;}
  .stage .sub{font-size:13.5px;color:var(--ink-soft);font-weight:700;margin:0 0 16px;}

  /* flashcard */
  .fcard{perspective:1200px;margin:0 auto 16px;max-width:330px;}
  .fcard .inner{position:relative;width:100%;aspect-ratio:4/3;transition:transform .5s;transform-style:preserve-3d;}
  .fcard.flip .inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);}
  .face.front{background:#fff;}
  .face.back{background:linear-gradient(160deg,#FFF3D6,#FFE3A8);transform:rotateY(180deg);}
  .face .em{font-size:52px;line-height:1;}
  .face .es{font-family:'Baloo 2';font-weight:800;font-size:30px;color:var(--ink);}
  .face .en{font-family:'Baloo 2';font-weight:700;font-size:26px;color:var(--leaf-dark);}
  .face .hint{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .tag{font-size:11px;font-weight:800;color:#fff;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;}

  .bigspeak:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-deep);}
  .ear{font-size:54px;text-align:center;}
  .listen-hint{text-align:center;font-weight:800;color:var(--sky-deep);margin:4px 0 12px;}
  .mic{background:var(--berry);color:#fff;border-radius:50%;width:96px;height:96px;font-size:46px;
    box-shadow:0 6px 0 var(--berry-dark);margin:10px auto;display:block;transition:transform .1s;}
  .mic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--berry-dark);}
  .mic.live{animation:pulse 1s ease-in-out infinite;background:var(--leaf);box-shadow:0 6px 0 var(--leaf-dark);}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .say-word{font-family:'Baloo 2';font-weight:800;font-size:38px;text-align:center;color:var(--ink);}
  .say-en{text-align:center;font-weight:700;color:var(--ink-soft);margin-top:2px;}
  .heard{text-align:center;font-weight:800;color:var(--ink-soft);min-height:22px;margin-top:8px;}
  .fc-controls{display:flex;gap:10px;align-items:center;justify-content:center;}
  .fc-progress{text-align:center;font-weight:800;color:var(--ink-soft);font-size:13px;margin-bottom:10px;}

  /* matching */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mtile{background:#fff;border-radius:14px;padding:13px 10px;font-weight:800;font-size:16px;text-align:center;
    box-shadow:var(--shadow-sm);transition:transform .1s, background .15s;color:var(--ink);min-height:50px;display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;}
  .mtile.sel{border-color:var(--sun);transform:scale(1.03);}
  .mtile.ok{background:#CDEFD6;color:var(--leaf-dark);box-shadow:none;opacity:.85;}
  .mtile.bad{animation:shake .35s;border-color:var(--berry);}

  .mtile .em{font-size:18px;margin-right:5px;}

  /* scramble */
  .scr-hint{text-align:center;margin-bottom:14px;}
  .scr-hint .em{font-size:52px;}
  .scr-hint .en{font-family:'Baloo 2';font-weight:700;font-size:24px;color:var(--leaf-dark);}
  .slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0;min-height:48px;}

  .slot.filled{box-shadow:inset 0 0 0 2px var(--sun);background:#FFF7E2;}
  .tiles{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
  .tile{width:42px;height:48px;border-radius:12px;background:linear-gradient(180deg,#fff,#f6ecdd);
    box-shadow:0 4px 0 #e0cdb4;font-family:'Baloo 2';font-weight:800;font-size:23px;color:var(--ink);}
  .tile:active{transform:translateY(3px);box-shadow:0 1px 0 #e0cdb4;}
  .tile.used{opacity:.25;pointer-events:none;}

  /* quiz / conjugation */
  .q{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px;text-align:center;}
  .q .em{font-size:46px;}
  .q .ask{font-family:'Baloo 2';font-weight:700;font-size:22px;color:var(--ink);margin-top:4px;}
  .q .ask b{color:var(--berry-dark);}
  .opts{display:grid;gap:10px;}
  .opt{background:#fff;border-radius:14px;padding:14px;font-weight:800;font-size:18px;color:var(--ink);

  .opt:active{transform:scale(.98);}
  .opt.ok{background:#CDEFD6;border-color:var(--leaf);color:var(--leaf-dark);}

  .qcount{text-align:center;font-weight:800;color:var(--ink-soft);font-size:13px;margin-bottom:10px;}

  .l0actions{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .l0wrong{color:var(--berry);text-decoration:line-through;font-weight:800;}

  .blank{display:inline-block;min-width:58px;padding:0 10px;margin:0 3px;border-bottom:3px solid var(--berry);
    color:var(--berry-dark);font-family:'Baloo 2';font-weight:800;}
  .blank.done{border-bottom-color:var(--leaf);color:var(--leaf-dark);background:#E6F6EA;border-radius:6px;}
  .tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tfbtn{font-size:19px;padding:18px;}

  /* finish / bloom */
  .bloom{text-align:center;padding:8px 4px 4px;}
  .bloom .flower{font-size:80px;animation:grow .6s cubic-bezier(.2,1.4,.4,1);}
  @keyframes grow{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
  .bloom .flower.tree-grow{font-size:110px;animation:treeGrow 1s cubic-bezier(.2,1.5,.4,1);}
  @keyframes treeGrow{0%{transform:scale(0) translateY(40px);opacity:0}50%{transform:scale(1.25) translateY(-6px)}70%{transform:scale(.92)}100%{transform:none;opacity:1}}
  .bloom.bonus-bloom h2{color:var(--sun-deep);}
  .bloom.bonus-bloom{background:radial-gradient(circle at 50% 30%, #FFF4D8 0%, transparent 70%);border-radius:24px;}
  .bloom h2{font-size:26px;color:var(--leaf-dark);margin:6px 0;}
  .bloom .starline{font-size:40px;letter-spacing:4px;margin:6px 0 2px;}
  .bloom p{font-weight:700;color:var(--ink-soft);margin:4px 0 18px;}

  .confetti{position:fixed;top:-10px;font-size:20px;z-index:60;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
  .mini-confetti{position:fixed;font-size:18px;z-index:70;pointer-events:none;animation:miniBurst .75s ease-out forwards;}
  @keyframes miniBurst{to{transform:translate(var(--dx),var(--dy)) rotate(240deg);opacity:0}}

  .footer-note{text-align:center;color:var(--ink-soft);font-size:12px;font-weight:700;margin-top:26px;line-height:1.6;}
  .footer-note button{background:none;color:var(--berry-dark);font-weight:800;text-decoration:underline;font-size:12px;padding:0;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:30px;font-weight:800;font-size:14px;box-shadow:var(--shadow);z-index:80;opacity:0;transition:opacity .3s, transform .3s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .levels{display:grid;gap:14px;}
  .level-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);
    border-radius:22px;padding:16px;box-shadow:var(--shadow);border:none;transition:transform .1s;cursor:pointer;}
  .level-card:active{transform:scale(.99);}
  .level-card .lc-badge{flex:0 0 auto;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;font-size:26px;color:#fff;background:linear-gradient(135deg,var(--leaf),var(--leaf-dark));box-shadow:var(--shadow-sm);}
  .level-card .lc-body{flex:1;min-width:0;}
  .level-card .lc-body h3{font-family:'Baloo 2';font-size:18px;color:var(--ink);}
  .level-card .lc-body p{margin:2px 0 8px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .lc-bar{height:10px;border-radius:8px;background:#EFE3D2;overflow:hidden;}
  .lc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--sun));border-radius:8px;}
  .lc-meta{margin-top:6px;font-size:12px;font-weight:800;color:var(--leaf-dark);}
  .lc-cta{flex:0 0 auto;align-self:center;background:var(--berry);color:#fff;font-weight:800;font-size:14px;
    padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 var(--berry-dark);white-space:nowrap;}
  .level-card.soon{opacity:.75;cursor:default;}
  .level-card.soon .lc-badge{background:linear-gradient(135deg,#c9b69c,#a98e6d);}
  /* Completed level card — green tint, gold trim */
  .level-card.level-done{background:linear-gradient(135deg,#E6F6EA 0%, #CDEFD6 100%);border:2px solid var(--leaf);}
  .level-card.level-done .lc-badge{background:linear-gradient(135deg,var(--leaf),var(--leaf-dark));font-size:30px;}
  .level-card.level-done .lc-body h3{color:var(--leaf-dark);}
  .level-card.level-done .lc-cta{background:var(--leaf);box-shadow:0 4px 0 var(--leaf-dark);}
  .level-card.level-done .lc-bar i{background:linear-gradient(90deg,var(--leaf),var(--sun));}
  .back{background:none;color:var(--leaf-dark);font-weight:800;font-size:15px;padding:6px 2px;margin:2px 0 0;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important;transition-duration:.05s !important;}
  }
</style>
</head>

/* Conjugation (present tense, regular) */
const ENDINGS = {
  ar:{yo:"o",tu:"as",el:"a",nos:"amos",ellos:"an"},
  er:{yo:"o",tu:"es",el:"e",nos:"emos",ellos:"en"},
  ir:{yo:"o",tu:"es",el:"e",nos:"imos",ellos:"en"}
};
const PRON = {yo:"Yo", tu:"Tú", el:"Él / Ella", nos:"Nosotros", ellos:"Ellos / Ellas"};
function conjugate(v, p){
  if(!v || !v.inf) return "";
  if(v.forms && v.forms[p]) return v.forms[p];
  if(!ENDINGS[v.t] || !ENDINGS[v.t][p]) return v.inf;
  return v.inf.slice(0,-2) + ENDINGS[v.t][p];
}

const SUBJECTS_BY_PRON = {
  yo:    ["Yo"],
  tu:    ["Tú"],
  el:    ["Él","Ella","Mi mamá","Mi papá","Mi hermano","Mi maestra","Mi abuela","El niño","La niña"],
  nos:   ["Nosotros","Nosotras","Mi familia y yo","Mis amigos y yo","Mi hermano y yo"],

/* Verb-agnostic object phrases that work for most regular verbs. */
const CONJ_OBJECTS = [
  " todos los días en mi casa.",
  " con mucha alegría cada mañana.",
  " un poco antes de la cena familiar.",
  " mucho durante los fines de semana.",
  " con mi familia los domingos por la tarde.",
  " durante las vacaciones de verano.",
  " después de la escuela siempre.",
  " cuando tengo un poco de tiempo libre.",
  " en el parque grande con mis amigos.",
  " muy bien y con mucho cuidado.",
  " por la mañana antes del desayuno.",
  " con mucho entusiasmo y energía.",
  " en mi habitación tranquilamente.",
  " los sábados con mis primos pequeños.",
];

function makeConjOpts(v, pron){
  const correct = conjugate(v, pron);
  const wrongProns = ["yo","tu","el","nos","ellos"].filter(x=>x!==pron);
  const distract = shuffle(wrongProns).slice(0,3).map(p=>conjugate(v,p));
  const opts = [...new Set([correct, ...distract])];
  while(opts.length<4) opts.push(v.inf); // pad with infinitive if dups collapsed
  return opts.slice(0,4);
}
function makeSerEstarOpts(form, pron){
  const forms = form==="ser" ? SER_FORMS : ESTAR_FORMS;
  const otherForms = form==="ser" ? ESTAR_FORMS : SER_FORMS;
  const correct = forms[pron];
  const sameWrongs = Object.entries(forms).filter(([p])=>p!==pron).map(([,f])=>f);
  const otherSame = otherForms[pron]; // same pronoun, other mood — common confusion
  const opts = [...new Set([correct, otherSame, ...shuffle(sameWrongs).slice(0,2)])];
  while(opts.length<4) opts.push(forms.yo);
  return opts.slice(0,4);
}
function makeConjQuestion(v, pron, objIdx, subjIdx){
  const subjList = SUBJECTS_BY_PRON[pron];
  const subj = subjList[subjIdx % subjList.length];
  const obj  = CONJ_OBJECTS[objIdx % CONJ_OBJECTS.length];
  return {
    pre: subj + " ",
    correct: conjugate(v, pron),
    opts: makeConjOpts(v, pron),
    hint: v.inf + " · " + pron,
    post: obj,
    verbId: v.id
  };
}

function uniqueBonusParagraph(day, pool){
  const theme = BONUS_PARAGRAPH_THEMES[(day-1) % BONUS_PARAGRAPH_THEMES.length];
  const n = Math.min(7, pool.length);
  const picks = [];
  const seen = new Set();
  const step = Math.max(1, Math.floor(pool.length / Math.max(1,n-1)));
  for(let k=0; picks.length<n && k<pool.length*2; k++){
    const v = pool[(day*3 + k*step + LVID) % pool.length];
    if(v && !seen.has(v.id)){ picks.push(v); seen.add(v.id); }
  }
  while(picks.length<n){
    const v=pool[picks.length % pool.length];
    if(v && !seen.has(v.id)){ picks.push(v); seen.add(v.id); } else break;
  }
  const prons=["yo","tu","el","nos","ellos"];
  const items=picks.map((v,idx)=>{
    const pron=prons[(day+idx) % prons.length];
    const subjects=SUBJECTS_BY_PRON[pron];
    const subj=subjects[(day+idx*2) % subjects.length];
    const correct=conjugate(v, pron);
    return {
      pre:subj+" ",
      correct,
      opts:makeConjOpts(v, pron),
      hint:v.inf+" · "+pron,
      post:" "+theme.tails[idx % theme.tails.length],
      verbId:v.id
    };
  });
  return {
    title:`${theme.title} ${day}`,
    intro:theme.intro,
    items
  };
}

/* Auto-generate a lesson plan from any verb list — runs to ~60 days total.
   Cadence: every 4 lessons before day 13, then a bonus quiz after EVERY lesson from day 13 onwards.
   All content uses only verbs already covered in prior lessons (quizzes use cur.pool dynamically). */
function buildPlan(verbs, totalDays){
  const ids=verbs.map(v=>v.id);
  const per=3;
  const introGames=["match","quiz","memory"];
  const mixGames=["match","quiz"]; // no memory in late mixed reviews (after day 30)
  const plan=[]; let d=0, gi=0, mi=0, sinceBonus=0;
  const introCount=Math.ceil(ids.length/per);
  const TARGET_DAYS=totalDays||60;
  function pushBonus(){ d++; plan.push({d, title:"Bonus Review", em:"🌳", game:"bonus_review", newV:[], bonus:true}); sinceBonus=0; }
  function afterLesson(){ if(d>=13) pushBonus(); else if(sinceBonus>=4) pushBonus(); }

  // Phase 1 — intros (with periodic reviews only in the early days; bonuses replace them from day 13)
  for(let i=0;i<introCount;i++){
    d++; sinceBonus++;
    plan.push({d, title:"New words", em:"🌱", game:introGames[gi++%introGames.length], newV:ids.slice(i*per,(i+1)*per)});
    if(i===introCount-1) break;
    if((i+1)%4===0 && d<13){ d++; sinceBonus++; plan.push({d, title:"Review", em:"🔁", game:introGames[gi++%introGames.length], newV:[]}); }
    afterLesson();
  }
  if(d>=13) pushBonus();

  // Phase 2 — conjugation drills, bonus after each
  [["ar","🔴"],["er","🟠"],["ir","🔵"]].forEach(([t,em])=>{
    if(verbs.some(v=>v.t===t)){
      d++; sinceBonus++; plan.push({d, title:t.toUpperCase()+" verb endings", em, game:"conj", conjType:t, newV:[]});
      pushBonus();
    }
  });

  // Phase 3 — mixed-review + bonus pairs until we have room for the 2 finishers
  while(d < TARGET_DAYS-2){
    d++; sinceBonus++; plan.push({d, title:"Mixed review", em:"🎯", game:mixGames[mi++%mixGames.length], newV:[]});
    if(d < TARGET_DAYS-2) pushBonus();
  }

  // Phase 4 — Ending master then Big finish (lands on TARGET_DAYS exactly)
  d++; plan.push({d, title:"Ending master", em:"🏅", game:"conj", conjType:"mix", newV:[]});
  d++; plan.push({d, title:"Big finish", em:"🎉", game:"quiz", newV:[], finale:true});
  return plan;
}
function planFor(level){
  if(level._plan) return level._plan;
  if(level.customPlan) return level._plan = level.customPlan;
  const totalDays = level.id===1 ? 70 : 60;
  let plan = buildPlan(level.verbs, totalDays);
  if(level.id===1){
    // All regular verbs are covered by day 45. Days 46–49 stay as pure quiz drills.
    // Days 50–70 become richer practice lessons (matching + sentence fill + paragraph fill),
    // driven by the standard Level 1 lesson flow in openDay.
    // Day 70 is the finale — larger quiz + rich flow.
    plan = plan.map(p=>{
      if(p.d>=46 && p.d<=49){
        return {d:p.d, title:"Quiz", em:"🎯", game:"quiz", newV:[], pureQuiz:true};
      }
      if(p.d>=50 && p.d<=70){
        const isFinale = p.d===70;
        // Rotate the primary game between quiz and match to keep it varied;
        // matching + fillblank + para_fill are added on top by openDay for Level 1.
        const games = ["quiz","match"];
        const game = isFinale ? "quiz" : games[p.d % games.length];
        return {d:p.d, title: isFinale?"Big finish":"Practice", em: isFinale?"🎉":"🎯",
          game, newV:[], finale: isFinale||undefined};
      }
      return p;
    });
  }
  return level._plan = plan;
}

/* verbs learned up to & including lesson d (in the current level) */
function learnedUpTo(d){
  const plan=planFor(LV); let s=[];
  for(const p of plan){ if(p.d<=d) s=s.concat(p.newV||[]); }
  if(LV && LV.unlockAllWhenNoNewV) return s.length? [...new Set(s)] : LV.verbs.map(v=>v.id);
  if(LV && LV.verbs && LV.verbs.length && plan.some(p=>(p.newV||[]).length)) return [...new Set(s)];
  return s.length? [...new Set(s)] : [];
}

function focusPracticePool(day, learnedPool, newSet){
  const st=lvState(LVID);
  const collected=(st.collected||[]).filter(id=>LV.verbs.some(v=>v.id===id));
  const collectedSet=new Set(collected);
  const recent=collected.slice(-24);
  const nextUnlearned=LV.verbs.filter(v=>!collectedSet.has(v.id)).slice(0,24).map(v=>v.id);
  const upcoming=(planFor(LV)||[])
    .filter(p=>p.d>=day && p.d<day+10)
    .flatMap(p=>p.newV||[]);
  const focusIds=new Set([...recent, ...nextUnlearned, ...upcoming, ...newSet.map(v=>v.id)]);
  const focused=learnedPool.filter(v=>focusIds.has(v.id));
  return focused.length>=Math.min(8, learnedPool.length) ? focused : learnedPool;
}

function level2MatchVerbs(learnedPool, newSet){
  const out=[];
  const add=v=>{ if(v && !out.some(x=>x.id===v.id)) out.push(v); };
  newSet.forEach(add);
  learnedPool.slice().reverse().forEach(add);
  return out.slice(0, Math.min(10, learnedPool.length));
}

/* ============================================================
   STORAGE — uses artifact storage when available, plus guarded
   localStorage fallback so downloaded/local files remember progress.
   ============================================================ */
const Store = (() => {
  const KEY = "learn_verb_activity_v2";
  let mem = null;
  function def(){ return {levels:{}, streak:0, lastDate:null}; }
  function lsGet(){ try{ const v=window.localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function lsSet(o){ try{ window.localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  async function load(){
    if(mem) return mem;
    let data=null;
    try{ if(window.storage && window.storage.get){ const r=await window.storage.get(KEY); if(r&&r.value) data=JSON.parse(r.value); } }catch(e){}
    if(!data) data=lsGet();                 // fallback for a downloaded/local file
    mem = data || def();
    if(!mem.levels) mem.levels={};
    return mem;
  }
  async function save(){
    try{ if(window.storage && window.storage.set){ await window.storage.set(KEY, JSON.stringify(mem)); } }catch(e){}
    lsSet(mem);                             // also persist locally whenever possible
  }
  async function reset(){ mem=def(); try{ window.localStorage.removeItem(KEY); }catch(e){} await save(); }
  function importData(obj){ mem=obj; if(!mem.levels) mem.levels={}; }
  return {load, save, reset, get:()=>mem, import:importData};
})();

function markDailyLevelActivity(levelId, sourceKey){
  ensureExtraState();
  const tk=todayKey();
  const day = STATE.dailyLevelActivity[tk] = STATE.dailyLevelActivity[tk] || {};
  const id = String(levelId);
  const bucket = day[id] = day[id] || {count:0, sources:{}};
  const src = sourceKey || `${id}:${Date.now()}`;
  if(!bucket.sources[src]){
    bucket.sources[src]=true;
    bucket.count++;
  }

  STATE.levelDailyDone[id]=tk;
  const activeLevels = Object.keys(day).filter(k=>(day[k] && (day[k].count||0)>0));
  if(activeLevels.length>=3 && !STATE.dailyCrossLevelRevived[tk]){
    STATE.dailyCrossLevelRevived[tk]=true;
    reviveAllLevelsForToday();
    return true;
  }
  return false;
}

function completionKeysFromState(s){
  const keys=[];
  for(const lid in (s.levels||{})){
    const completed=(s.levels[lid]&&s.levels[lid].completed)||{};
    for(const d in completed){ if(completed[d]) keys.push(`level:${lid}:day:${d}`); }
  }
  const practice=(s.practiceRegular&&s.practiceRegular.completed)||{};
  for(const testNum in practice){ if(practice[testNum]) keys.push(`practiceRegular:${testNum}`); }
  const hw=(s.spanishHW&&s.spanishHW.completed)||{};
  for(const quizId in hw){ if(hw[quizId]) keys.push(`spanishHW:${quizId}`); }
  return keys;
}

function ensureSurpriseState(s){
  s.surpriseQuiz = s.surpriseQuiz || {};
  const q=s.surpriseQuiz;
  q.completedKeys = q.completedKeys || {};
  if(typeof q.completedCount!=="number"){
    const keys=completionKeysFromState(s);
    keys.forEach(k=>{ q.completedKeys[k]=true; });
    q.completedCount=keys.length;
  }
  q.pending=!!q.pending;
}

function recordGlobalCompletion(sourceKey){
  ensureSurpriseState(STATE);
  const q=STATE.surpriseQuiz;
  if(q.completedKeys[sourceKey]) return false;
  q.completedKeys[sourceKey]=true;
  q.completedCount=(q.completedCount||0)+1;
  // 🎁 Surprise quiz pop-up disabled — was triggering after every 4 completions.
  // Bonus Review days on the lesson grid (🌳) handle review practice instead.
  q.pending=false;
  return false;
}

/* Record a verb practice attempt — drives spaced repetition. firstTryNoHint = true
   means Kabir got it right cleanly. Calls accumulate; saved with the rest at commit. */
function recordVerbAttempt(verbId, firstTryNoHint){
  if(!verbId) return;
  ensureExtraState();
  const key = `${LVID||1}|${verbId}`;
  const s = STATE.verbStats[key] = STATE.verbStats[key] || {attempts:0, correct:0};
  s.attempts++;
  if(firstTryNoHint) s.correct++;
}
function stripHTML(s){ return String(s||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); }
function recordMissedQuestion(q){
  ensureExtraState();
  const k=todayKey();
  const arr=STATE.missHistory[k]=STATE.missHistory[k]||[];
  arr.push({
    ts:new Date().toISOString(),
    source:q.source||"Lesson",
    type:q.type||"",
    prompt:stripHTML(q.prompt),
    correct:String(q.correct||""),
    given:String(q.given||""),
    verbId:q.verbId||null
  });
  if(arr.length>80) STATE.missHistory[k]=arr.slice(-80);
  Store.save();
}
function addRedoQuestion(q){
  cur.redoQueue.push(q);
  recordMissedQuestion({source:`Lesson ${cur.plan.d}`, type:cur.plan.title, prompt:q.prompt, correct:q.correct, verbId:q.verbId});
}

function avgMisses(days){
  if(!days.length) return 0;
  return days.reduce((sum,d)=>sum+((STATE.missHistory&&STATE.missHistory[d])||[]).length,0)/days.length;
}

function missTrend(){
  const days=Object.keys(STATE.missHistory||{}).sort();
  const recent=days.slice(-3);
  const previous=days.slice(-6,-3);
  if(!recent.length) return {label:"No miss history yet", recent:0, previous:0, better:null};
  const recentAvg=avgMisses(recent);
  const prevAvg=avgMisses(previous);
  if(previous.length<2) return {label:"Building history", recent:recentAvg, previous:prevAvg, better:null};
  if(recentAvg < prevAvg) return {label:"Getting better", recent:recentAvg, previous:prevAvg, better:true};
  if(recentAvg > prevAvg) return {label:"Needs focus", recent:recentAvg, previous:prevAvg, better:false};
  return {label:"Steady", recent:recentAvg, previous:prevAvg, better:null};
}

/* Weighted sample (without replacement) — biases toward items with higher weight. */
function weightedSample(items, n){
  const out = [];
  const pool = items.map(x=>({v:x.v, weight:Math.max(0.05, x.weight)}));
  for(let i=0; i<n && pool.length; i++){
    const total = pool.reduce((s,x)=>s+x.weight, 0);
    let r = Math.random() * total, idx = 0;
    for(let j=0; j<pool.length; j++){ r -= pool[j].weight; if(r<=0){ idx=j; break; } }
    out.push(pool[idx].v);
    pool.splice(idx, 1);
  }
  return out;
}

function trophyCategory(id){
  if(id.startsWith("fiesta")) return "fiesta";
  if(id==="first-step"||id==="three-star"||id==="conj-master") return "core";
  if(id.startsWith("streak")) return "streak";
  if(id.startsWith("stars-")) return "stars";
  if(id.startsWith("regular")) return "regular";
  if(id.startsWith("irregular")) return "irregular";
  if(id.startsWith("tense")) return "tense";
  if(id.startsWith("house")) return "house";
  if(id.startsWith("practice")) return "practice";
  if(id.startsWith("hw")) return "hw";
  if(id.startsWith("bonus-")||id==="surprise-quiz"||id==="tree") return "bonus";
  if(id.startsWith("lessons-")) return "lessons";
  if(id.startsWith("master-")||id.startsWith("verbs-")) return "mastery";
  if(id.startsWith("saplings-")) return "saplings";
  if(id.startsWith("trees-")) return "trees";
  if(/^level\d+-done$/.test(id) || id==="all-levels-done") return "levels";
  if(id.startsWith("perfect-")) return "perfect";
  return "core";
}
/* Rarity tier: platinum / gold / silver / bronze — controls ring color + tier ribbon */
function trophyTier(t){
  const id=t.id;
  const bigWords=/perfect|all|champion|grandmaster|legend|royalty|master|hero|sage|wizard|unstoppable|cosmic|storm/i;
  const goldWords=/scholar|hunter|pro|architect|ace|listen(er|ing)|maker|sharp|storm|patch|forest|blooming|wildflower|marathon|streak30|streak60|streak14/i;
  const silverWords=/sprout|explorer|trio|starter|steady|warrior|going|quarter/i;
  if(/perfect|-all\b|-perfect\b/i.test(id) || bigWords.test(id)) return "platinum";
  if(goldWords.test(id)) return "gold";
  if(silverWords.test(id)) return "silver";
  // Numeric heuristic: trailing large numbers = higher tier
  const m=id.match(/-(\d+)(?:s-(\d+))?$/);
  if(m){
    const n = parseInt(m[2]||m[1],10);
    if(n>=25) return "gold";
    if(n>=10) return "silver";
  }
  return "bronze";
}

function trophySnapshot(){
  let totalLessonsDone=0, anyThreeStars=false, bonusThreeStars=false, totalStars=0, allVerbsLearned=false, verbsLearned=0;
  let regularVerbsLearned=0, irregularVerbsLearned=0, perfectCount=0;
  let saplingsCount=0, treesCount=0;            // 3-star regular vs 3-star bonus lessons
  let level1Complete=false, level2Complete=false;
  let bonusLessonsDone=0;                       // total bonus reviews completed
  let level1ThreeStarLessons=0, level2ThreeStarLessons=0;
  const conjThreeStars=new Set();
  for(const lid in STATE.levels){
    const st=STATE.levels[lid]; const lv=LEVELS.find(l=>String(l.id)===String(lid));
    if(!lv) continue;
    const plan=planFor(lv);
    let lvDone=0; const lvTotal=plan.length;
    for(const dk in (st.completed||{})){
      if(!st.completed[dk]) continue;
      lvDone++;
      totalLessonsDone++;
      const stars=(st.stars||{})[dk]||0;
      totalStars+=stars;
      if(stars===3) anyThreeStars=true;
      if(stars===3) perfectCount++;
      const p=plan.find(pp=>String(pp.d)===String(dk));
      const isBonus = !!(p && p.bonus);
      if(isBonus) bonusLessonsDone++;
      if(stars===3){
        if(isBonus){ treesCount++; bonusThreeStars=true; }
        else { saplingsCount++; }
        if(String(lid)==="1") level1ThreeStarLessons++;
        if(String(lid)==="2") level2ThreeStarLessons++;
      }
      if(p && p.game==="conj" && p.conjType && p.conjType!=="mix" && stars===3) conjThreeStars.add(p.conjType);
    }
    if(lvDone>=lvTotal){
      if(String(lid)==="1") level1Complete=true;
      if(String(lid)==="2") level2Complete=true;
    }
    const collected=(st.collected||[]).length;
    verbsLearned+=collected;
    if(String(lid)==="1") regularVerbsLearned=collected;
    if(String(lid)==="2") irregularVerbsLearned=collected;
    if(lv.verbs.length>0 && collected>=lv.verbs.length) allVerbsLearned=true;
  }
  let masteredCount=0;
  const stats=STATE.verbStats||{};
  for(const id in stats){ const s=stats[id]; if(s.attempts>=3 && s.correct/s.attempts>=0.9) masteredCount++; }
  const practiceRegular=STATE.practiceRegular||{completed:{}};
  const practiceTestsDone = Object.values(practiceRegular.completed||{}).filter(Boolean).length;
  const practiceFullyDone = practiceTestsDone >= 10;
  const practiceThreeStar = Object.values(practiceRegular.stars||{}).filter(s=>s===3).length;
  const hwState = STATE.spanishHW||{completed:{}, stars:{}};
  const hwDone = Object.values(hwState.completed||{}).filter(Boolean).length;
  const hwTotal = (STATE.spanishHWMeta&&STATE.spanishHWMeta.totalQuizzes)||0;
  const hwFullyDone = hwTotal>0 && hwDone>=hwTotal;
  const hwThreeStar = Object.values(hwState.stars||{}).filter(s=>s===3).length;
  const surpriseFinished = !!(STATE.surpriseQuiz && STATE.surpriseQuiz.lastFinishedAt);
  // Level 1 / Level 2 "perfect all lessons" flags
  const lv1Plan = LEVELS.find(l=>l.id===1); const lv1Total = lv1Plan ? planFor(lv1Plan).length : 0;
  const lv2Plan = LEVELS.find(l=>l.id===2); const lv2Total = lv2Plan ? planFor(lv2Plan).length : 0;
  const level1Perfect = lv1Total>0 && level1ThreeStarLessons>=lv1Total;
  const level2Perfect = lv2Total>0 && level2ThreeStarLessons>=lv2Total;
  // Level 3 · Verb Tenses (Futuro cercano) counters
  let tenseLessonsDone=0, tenseThreeStar=0;
  const lv3State = STATE.levels && STATE.levels[3];
  const lv3 = LEVELS.find(l=>l.id===3);
  const lv3Total = lv3 ? planFor(lv3).length : 0;
  if(lv3State){
    for(const dk in (lv3State.completed||{})){
      if(!lv3State.completed[dk]) continue;
      tenseLessonsDone++;
      const stars=(lv3State.stars||{})[dk]||0;
      if(stars===3) tenseThreeStar++;
    }
  }
  const tenseAllDone = lv3Total>0 && tenseLessonsDone>=lv3Total;
  const tensePerfect = lv3Total>0 && tenseThreeStar>=lv3Total;
  // Level 4 · La Casa counters
  let houseLessonsDone=0, houseQuizzesDone=0, houseThreeStarQuizzes=0;
  let houseRoomsLearned=0, houseFurnitureLearned=0, housePartsLearned=0, houseWordsLearned=0;
  let houseSentenceCorrect=0, houseListeningCorrect=0, houseNoHintQuiz=false, houseLevelComplete=false;
  const lv4 = LEVELS.find(l=>l.id===4);
  const lv4State = STATE.levels && STATE.levels[4];
  const lv4Total = lv4 ? planFor(lv4).length : 0;
  if(lv4State && lv4){
    const plan = planFor(lv4);
    const learnedIds = new Set();
    for(const dk in (lv4State.completed||{})){
      if(!lv4State.completed[dk]) continue;
      const p = plan.find(pp=>String(pp.d)===String(dk));
      const stars=(lv4State.stars||{})[dk]||0;
      if(!p) continue;
      if(p.houseType==="quiz"){
        houseQuizzesDone++;
        if(stars===3) houseThreeStarQuizzes++;
      } else {
        houseLessonsDone++;
      }
      (p.newV||[]).forEach(id=>learnedIds.add(id));
    }
    houseWordsLearned = learnedIds.size;
    learnedIds.forEach(id=>{
      const v = lv4.verbs.find(x=>x.id===id);
      if(!v) return;
      if(v.group==="room") houseRoomsLearned++;
      else if(v.group==="furniture") houseFurnitureLearned++;
      else if(v.group==="house_part") housePartsLearned++;
    });
    const house = lv4State.house || {};
    houseSentenceCorrect = house.sentenceCleanWin||0;
    houseListeningCorrect = house.listenCleanWin||0;
    houseNoHintQuiz = !!house.noHint3Star;
    const doneCount = Object.values(lv4State.completed||{}).filter(Boolean).length;
    houseLevelComplete = lv4Total>0 && doneCount>=lv4Total;
  }
  const houseAllRooms = lv4 ? lv4.verbs.filter(v=>v.group==="room").length : 0;
  const houseAllFurniture = lv4 ? lv4.verbs.filter(v=>v.group==="furniture").length : 0;
  // Level 0 · Vocab Fiesta counters
  let fiestaLessonsDone=0, fiestaQuizzesDone=0, fiestaThreeStarQuizzes=0;
  let fiestaColors=0, fiestaPhys=0, fiestaPers=0, fiestaPlace=0;
  let fiestaQuestion=0, fiestaProf=0, fiestaWeekday=0, fiestaMonth=0;
  const lv5 = LEVELS.find(l=>l.id===0);
  const lv5State = STATE.levels && STATE.levels[0];
  const lv5Total = lv5 ? planFor(lv5).length : 0;
  const learnedFiestaIds = new Set();
  if(lv5State && lv5){
    const plan5 = planFor(lv5);
    for(const dk in (lv5State.completed||{})){
      if(!lv5State.completed[dk]) continue;
      const p = plan5.find(pp=>String(pp.d)===String(dk));
      if(!p) continue;
      const stars=(lv5State.stars||{})[dk]||0;
      if(p.fiestaQuiz){
        fiestaQuizzesDone++;
        if(stars===3) fiestaThreeStarQuizzes++;
      } else {
        fiestaLessonsDone++;
      }
      (p.newV||[]).forEach(id=>learnedFiestaIds.add(id));
    }
    learnedFiestaIds.forEach(id=>{
      const v = lv5.verbs.find(x=>x.id===id);
      if(!v) return;
      if(v.group==="color") fiestaColors++;
      else if(v.group==="adj_phys") fiestaPhys++;
      else if(v.group==="adj_pers") fiestaPers++;
      else if(v.group==="place") fiestaPlace++;
      else if(v.group==="question") fiestaQuestion++;
      else if(v.group==="profession") fiestaProf++;
      else if(v.group==="weekday") fiestaWeekday++;
      else if(v.group==="month") fiestaMonth++;
    });
  }
  const fiestaWordsLearned = learnedFiestaIds.size;
  const fiestaColorTotal   = lv5 ? lv5.verbs.filter(v=>v.group==="color").length : 0;
  const fiestaPhysTotal    = lv5 ? lv5.verbs.filter(v=>v.group==="adj_phys").length : 0;
  const fiestaPersTotal    = lv5 ? lv5.verbs.filter(v=>v.group==="adj_pers").length : 0;
  const fiestaPlaceTotal   = lv5 ? lv5.verbs.filter(v=>v.group==="place").length : 0;
  const fiestaQuestionTotal= lv5 ? lv5.verbs.filter(v=>v.group==="question").length : 0;
  const fiestaProfTotal    = lv5 ? lv5.verbs.filter(v=>v.group==="profession").length : 0;
  const fiestaWeekdayTotal = lv5 ? lv5.verbs.filter(v=>v.group==="weekday").length : 0;
  const fiestaMonthTotal   = lv5 ? lv5.verbs.filter(v=>v.group==="month").length : 0;
  const fiestaDoneCount = lv5State ? Object.values(lv5State.completed||{}).filter(Boolean).length : 0;
  const fiestaLevelComplete = lv5Total>0 && fiestaDoneCount>=lv5Total;
  return {
    streak:STATE.streak||0,
    totalLessonsDone, anyThreeStars, bonusThreeStars, totalStars, perfectCount,
    saplingsCount, treesCount, bonusLessonsDone,
    level1Complete, level2Complete, level1ThreeStarLessons, level2ThreeStarLessons, level1Perfect, level2Perfect,
    tenseLessonsDone, tenseThreeStar, tenseAllDone, tensePerfect,
    houseLessonsDone, houseQuizzesDone, houseWordsLearned, houseRoomsLearned, houseFurnitureLearned, housePartsLearned,
    houseAllRoomsLearned: houseAllRooms>0 && houseRoomsLearned>=houseAllRooms,
    houseAllFurnitureLearned: houseAllFurniture>0 && houseFurnitureLearned>=houseAllFurniture,
    houseAllWordsLearned: lv4 ? houseWordsLearned>=lv4.verbs.length : false,
    houseThreeStarQuizzes, houseSentenceCorrect, houseListeningCorrect, houseNoHintQuiz, houseLevelComplete,
    verbsLearned, regularVerbsLearned, irregularVerbsLearned, allVerbsLearned,
    conjMasterDone: ["ar","er","ir"].every(t=>conjThreeStars.has(t)),
    masteredCount,
    practiceTestsDone, practiceFullyDone, practiceThreeStar,
    hwDone, hwFullyDone, hwThreeStar, surpriseFinished,
    fiestaLessonsDone, fiestaQuizzesDone, fiestaThreeStarQuizzes, fiestaWordsLearned,
    fiestaColors, fiestaPhys, fiestaPers, fiestaPlace, fiestaQuestion, fiestaProf,
    fiestaWeekday, fiestaMonth,
    fiestaColorsAll:   fiestaColorTotal>0   && fiestaColors  >=fiestaColorTotal,
    fiestaPhysAll:     fiestaPhysTotal>0    && fiestaPhys    >=fiestaPhysTotal,
    fiestaPersAll:     fiestaPersTotal>0    && fiestaPers    >=fiestaPersTotal,
    fiestaPlaceAll:    fiestaPlaceTotal>0   && fiestaPlace   >=fiestaPlaceTotal,
    fiestaQuestionAll: fiestaQuestionTotal>0&& fiestaQuestion>=fiestaQuestionTotal,
    fiestaProfAll:     fiestaProfTotal>0    && fiestaProf    >=fiestaProfTotal,
    fiestaWeekdayAll:  fiestaWeekdayTotal>0 && fiestaWeekday >=fiestaWeekdayTotal,
    fiestaMonthAll:    fiestaMonthTotal>0   && fiestaMonth   >=fiestaMonthTotal,
    fiestaAllWords:    lv5 ? fiestaWordsLearned>=lv5.verbs.length : false,
    fiestaLevelComplete
  };
}

/* ======================================================================
   REVIVAL COUPON — after every 2 days of inactivity, saplings "wither" and
   Kabir is offered a one-time revival coupon. To redeem, he finishes 1
   chapter (lesson) in every level. The coupon then revives the garden.
   ====================================================================== */
function daysBetween(a, b){
  if(!a || !b) return 0;
  return Math.floor((Date.parse(b+"T00:00:00Z") - Date.parse(a+"T00:00:00Z"))/86400000);
}
function daysSinceLastActivity(){
  ensureExtraState();
  if(!STATE.lastDate) return 0;
  return Math.max(0, daysBetween(STATE.lastDate, todayKey()));
}
/* Wilt tiers:
     0 = fresh (0 days away)
     1 = DRY (1 day away)   → plants droop, revive by just doing any activity
     2 = DEAD (2 days away)  → coupon offering: 2 lessons per level to redeem
     3 = PIXIE (3+ days away)→ magic-pixie coupon: 1 lesson per level, sparkle animation
*/
function getWiltStage(){
  const d = daysSinceLastActivity();
  if(d >= 3) return 3;
  if(d >= 2) return 2;
  if(d >= 1) return 1;
  return 0;
}
function saplingsWithered(){ return getWiltStage() >= 1; }
function couponOwedNow(){
  ensureExtraState();
  // Coupon only charges saplings after 5+ missed days.
  // Missing < 5 days revives for free (via reviveAllLevelsForToday on lesson completion).
  if(daysSinceLastActivity() < 5) return false;
  const stage = getWiltStage();
  const active = STATE.revive.active;
  if(!active) return true;                       // never issued one this absence
  if(!active.redeemedAt && !active.discardedAt){
    // still open — reissue at higher tier if inactivity grew
    if((active.tier||2) < stage) return true;
    return true;
  }
  // Previously redeemed/discarded — only offer again after a fresh 2-day absence beyond that
  const closedAt = (active.redeemedAt || active.discardedAt || "").slice(0,10);
  if(!closedAt) return false;
  return daysBetween(closedAt, todayKey()) >= 2;
}
/* Sapling wallet — saplings are earned by 3-starring regular lessons and spent on revival coupons.
   Display = lifetime earned minus spent (never negative). Trophies still use lifetime count. */
function saplingsEarnedLifetime(){
  ensureExtraState();
  let count=0;
  for(const lid in STATE.levels){
    const s=STATE.levels[lid]; const lv=LEVELS.find(l=>String(l.id)===String(lid));
    if(!lv) continue;
    const plan=planFor(lv);
    for(const dk in (s.stars||{})){
      if(!s.completed || !s.completed[dk]) continue;
      if((s.stars[dk]||0)!==3) continue;
      const p=plan.find(pp=>String(pp.d)===String(dk));
      if(p && !p.bonus) count++;                                // 3-star regular (non-bonus) lesson
    }
  }
  return count;
}
function saplingsAvailable(){
  return Math.max(0, saplingsEarnedLifetime() - (STATE.revive.saplingsSpent||0));
}
const REVIVAL_COUPON_FIXED_COST = 0;   // free revive for now
function revivalCouponCost(){
  return REVIVAL_COUPON_FIXED_COST;
}

function issueRevivalCoupon(){
  ensureExtraState();
  const r = STATE.revive;
  r.couponSerial = (r.couponSerial||0) + 1;
  const stage = getWiltStage();                                 // 2 or 3
  const tier = stage === 3 ? 3 : 2;
  const themeTag = tier === 3 ? "PIXIE-" : "REVIVE-";
  const serial = themeTag + String(Date.now()).slice(-4) + "-" + String(r.couponSerial).padStart(3,"0");
  const cost = revivalCouponCost(r.couponSerial);
  r.active = {
    serial, tier, cost,
    issuedAt:new Date().toISOString(),
    daysAway:daysSinceLastActivity(),
    redeemedAt:null, discardedAt:null
  };
  Store.save();
  return r.active;
}
/* Legacy hook — the old flow called this on every lesson commit to tick per-level progress.
   With the sapling-cost coupon that's no longer needed, but keep the export as a no-op so
   existing commitDay callers don't break. */
function markLevelChapterDone(){ return false; }

function redeemRevivalCoupon(){
  ensureExtraState();
  const c = STATE.revive.active;
  if(!c || c.redeemedAt) return {ok:false, reason:"no-active"};
  c.cost = revivalCouponCost();
  const avail = saplingsAvailable();
  if(avail < c.cost) return {ok:false, reason:"not-enough", cost:c.cost, avail};
  STATE.revive.saplingsSpent = (STATE.revive.saplingsSpent||0) + c.cost;
  c.redeemedAt = new Date().toISOString();
  c.spent = c.cost;
  STATE.revive.history = STATE.revive.history || [];
